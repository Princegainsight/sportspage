<!-- ============ ENGINE AND UI ============ -->
<script id="engine">
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const state={cur:'start',done:new Set(),keep:{},engine:'loading',db:null,mock:null,timer:null,secs:120};
const CDN='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/';
/* thresholds are fixed after testing against the generated data */
const TH=25;
Object.keys(EXERCISES).forEach(k=>{const e=EXERCISES[k];if(e.q)e.q=e.q.replace(/__T__/g,TH);if(e.sol)e.sol=e.sol.replace(/__T__/g,TH);});

/* ---------- engine ---------- */
function loadEngine(){
  const s=document.createElement('script');
  s.src=CDN+'sql-wasm.js';
  s.onload=()=>{
    initSqlJs({locateFile:f=>CDN+f}).then(SQL=>{
      state.db=new SQL.Database();
      state.db.run(genSetup());
      state.engine='ready';updateEngine();
    }).catch(()=>{state.engine='failed';updateEngine();});
  };
  s.onerror=()=>{state.engine='failed';updateEngine();};
  document.head.appendChild(s);
}
function updateEngine(){
  const b=$('#engineBox');if(!b)return;
  const m={loading:['loading','Loading the SQL engine. Practice boxes will work in a few seconds.'],ready:['ready','SQL engine is ready. All practice data is loaded in your browser.'],failed:['failed','The SQL engine could not load. Check your internet and refresh this page. You can still read hints and solutions.']}[state.engine];
  b.innerHTML='<div class="engine '+m[0]+'" role="status">'+m[1]+'</div>';
}
function runSQL(sql){
  if(state.engine!=='ready')throw new Error(state.engine==='failed'?'SQL engine could not load. Check your internet and refresh the page.':'SQL engine is still loading. Try again in a few seconds.');
  const t=sql.trim().replace(/;+\s*$/,'');
  if(!t)throw new Error('Type a query first.');
  if(!/^(select|with)\b/i.test(t)&&!/^(--[^\n]*\n\s*)*(select|with)\b/i.test(t))throw new Error('Only SELECT or WITH queries can be run here.');
  if(/\b(insert|update|delete|drop|alter|create|attach|detach|pragma|vacuum)\b/i.test(t.replace(/--[^\n]*/g,'')))throw new Error('This console allows read-only queries only.');
  const r=state.db.exec(t);
  return r.length?r[r.length-1]:{columns:[],values:[]};
}
function norm(res,ordered){
  const rows=res.values.map(r=>JSON.stringify(r.map(c=>typeof c==='number'?Math.round(c*1000)/1000:(c===null?null:String(c).trim()))));
  return ordered?rows:rows.sort();
}
function tableHTML(res){
  if(!res.columns.length)return '<div class="msg info">Query ran. No rows returned.</div>';
  const max=15;
  let h='<div class="tablewrap"><table><tr>'+res.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  res.values.slice(0,max).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+(c===null?'<i>NULL</i>':esc(c))+'</td>').join('')+'</tr>';});
  h+='</table></div>';
  if(res.values.length>max)h+='<p style="font-size:.85rem;color:var(--muted)">Showing first '+max+' of '+res.values.length+' rows.</p>';
  else h+='<p style="font-size:.85rem;color:var(--muted)">'+res.values.length+' row'+(res.values.length===1?'':'s')+'.</p>';
  return h;
}

/* ---------- exercise UI ---------- */
function hydrateExercises(){
  $$('.ex').forEach(box=>{
    const id=box.dataset.ex,e=EXERCISES[id];if(!e)return;
    const graded=!e.kind;
    const key='sql-'+id;
    box.innerHTML='<div class="exq"><p>'+esc(e.q)+'</p>'+(e.hint?'<details><summary>Hint</summary><div class="dbody">'+esc(e.hint)+'</div></details>':'')+'</div>'+
     '<textarea class="sql" spellcheck="false" aria-label="SQL query" data-keep="'+key+'">'+esc(e.start||'')+'</textarea>'+
     '<div class="bar2"><button class="btn sm run">Run query</button>'+(graded?'<button class="btn alt sm chk">Check my answer</button><button class="btn alt sm sh">Show solution</button>':'')+'<button class="btn alt sm rs">Reset</button></div><div class="out" aria-live="polite"></div>';
    const ta=$('textarea',box),out=$('.out',box);
    const run=()=>{try{const r=runSQL(ta.value);return r;}catch(err){out.innerHTML='<div class="msg bad">'+esc(err.message)+'</div>';return null;}};
    $('.run',box).onclick=()=>{const r=run();if(r)out.innerHTML=tableHTML(r);};
    $('.rs',box).onclick=()=>{ta.value=e.start||'';state.keep[key]=ta.value;out.innerHTML='';};
    if(graded){
      $('.chk',box).onclick=()=>{
        const mine=run();if(!mine)return;
        let exp;try{exp=runSQL(e.sol);}catch(err){out.innerHTML='<div class="msg bad">'+esc(err.message)+'</div>';return;}
        const ordered=!!e.order;
        const a=norm(mine,ordered),b=norm(exp,ordered);
        let msg;
        if(mine.values.length===0&&exp.values.length>0)msg='<div class="msg bad">Your query returned no rows, but rows are expected. Check your filters and joins.</div>';
        else if(mine.columns.length!==exp.columns.length)msg='<div class="msg bad">Close, but the number of columns is different. Expected '+exp.columns.length+' column(s), you returned '+mine.columns.length+'.</div>';
        else if(a.length!==b.length)msg='<div class="msg bad">Not yet. You returned '+a.length+' row(s), but '+b.length+' are expected. Think about duplicates, filters, and join type.</div>';
        else if(JSON.stringify(a)!==JSON.stringify(b))msg='<div class="msg bad">Row count matches, but some values are different. Check your calculation and grouping.</div>';
        else msg='<div class="msg ok">Correct. Your result matches. '+esc(e.expl||'')+'</div>';
        out.innerHTML=msg+tableHTML(mine);
      };
      $('.sh',box).onclick=()=>{out.innerHTML='<div class="sol"><b>One correct solution:</b><pre><code>'+esc(e.sol)+'</code></pre><p>'+esc(e.expl||'')+'</p></div>'+out.innerHTML;};
    }
  });
}

/* ---------- keep values while page is open ---------- */
function hydrateKeep(){
  $$('[data-keep]').forEach(el=>{
    if(el.dataset.bound)return;el.dataset.bound='1';
    const k=el.dataset.keep;
    if(k in state.keep){if(el.type==='checkbox')el.checked=!!state.keep[k];else el.value=state.keep[k];}
    else if(el.type!=='checkbox'&&el.value)state.keep[k]=el.value;
    el.addEventListener('input',()=>{state.keep[k]=el.type==='checkbox'?el.checked:el.value;});
    el.addEventListener('change',()=>{state.keep[k]=el.type==='checkbox'?el.checked:el.value;});
  });
}
function copyText(t,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1500);};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){btn.textContent='Select and copy manually';}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(fb);else fb();
}

/* ---------- topic specific UI ---------- */
function hydrateTopic(id){
  if(id==='prio')mountEditor('prioBox','prio-ans',PRIO_ANS,{label:'Prioritisation answer',h:'18rem',target:'Target: 80 to 100 seconds.'});
  if(id==='story18')mountEditor('s18box','story18',STORY18,{label:'18 ticket story',h:'30rem',brackets:true,target:'Target: 120 to 150 seconds. If it runs longer, shorten the Situation and keep the Action part.'});
  if(id==='start'){
    $('#plan').innerHTML=PLAN.map(p=>'<div class="day"><div class="big"><b>'+p.d+'</b></div><div><h3>'+p.t+'</h3><div class="links">'+p.m.map(x=>'<button class="btn alt sm" data-go="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div></div>').join('');
  }
  if(id==='intro'){
    $('#intros').innerHTML=INTROS.map((v,i)=>'<div class="card"><h3>'+esc(v.t)+'</h3><p style="color:var(--muted);margin-top:0">'+esc(v.when)+' '+esc(v.target)+'</p>'+
      '<textarea id="iv'+i+'" style="min-height:15rem" data-keep="intro-v'+i+'" aria-label="'+esc(v.t)+'"></textarea>'+
      '<div class="row"><button class="btn sm icnt" data-i="'+i+'">Count words and time</button><button class="btn alt sm icp" data-i="'+i+'">Copy</button><button class="btn alt sm irs" data-i="'+i+'">Reset to original</button></div>'+
      '<p id="ic'+i+'" aria-live="polite" style="color:var(--muted);font-size:.9rem;margin:.2rem 0 0"></p></div>').join('');
    INTROS.forEach((v,i)=>{$('#iv'+i).value=v.text;});
    $$('.icnt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i,t=$('#iv'+i).value.trim(),w=t?t.split(/\s+/).length:0;
      $('#ic'+i).textContent=w+' words, about '+Math.round(w/130*60)+' seconds when spoken at a calm pace. '+INTROS[i].target;
    });
    $$('.icp').forEach(b=>b.onclick=e=>copyText($('#iv'+(+b.dataset.i)).value,e.target));
    $$('.irs').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;$('#iv'+i).value=INTROS[i].text;state.keep['intro-v'+i]=INTROS[i].text;$('#ic'+i).textContent='Reset to the original version.';});
  }
  if(id==='star'){
    const slots=[
     ['Customer Obsession','A time you went beyond the ticket to solve the customer\'s real problem.'],
     ['Dive Deep','A hard issue where you found the real root cause.'],
     ['Ownership','Something you owned that was not strictly your job.'],
     ['Bias for Action','A quick decision with incomplete information.'],
     ['Earn Trust','A mistake you made and how you handled it.'],
     ['Invent and Simplify','A document, script, template or process you improved.'],
     ['Have Backbone','A time you disagreed or pushed back respectfully.']
    ];
    $('#stars').innerHTML=slots.map((s,i)=>'<details'+(i===0?' open':'')+'><summary>'+s[0]+'</summary><div class="dbody"><p>'+s[1]+'</p>'+
      '<div class="star-grid">'+['Situation','Task','Action (what I did)','Result (with numbers)'].map((l,j)=>'<div><label class="f" for="s'+i+'_'+j+'">'+l+'</label><textarea id="s'+i+'_'+j+'" data-keep="star-'+i+'-'+j+'"></textarea></div>').join('')+'</div>'+
      '<div class="row"><button class="btn sm comb" data-i="'+i+'">Combine and time it</button></div><div class="card" id="so'+i+'" style="display:none"></div></div></details>').join('');
    hydrateKeep();
    const combine=i=>{
      const v=j=>(state.keep['star-'+i+'-'+j]||'').trim();
      const t=[v(0),v(1),v(2),v(3)].filter(Boolean).join(' ');
      const w=t?t.split(/\s+/).length:0;
      const o=$('#so'+i);o.style.display='block';
      o.innerHTML=w?'<p>'+esc(t)+'</p><p style="color:var(--muted);font-size:.9rem">'+w+' words, about '+Math.round(w/130*60)+' seconds spoken. Target: 120 seconds, with Action being the longest part.</p>':'<p>Write something in the boxes first.</p>';
    };
    $$('.comb').forEach(b=>b.onclick=()=>combine(+b.dataset.i));
    $('#cpStars').onclick=e=>{
      const all=slots.map((s,i)=>{const v=j=>(state.keep['star-'+i+'-'+j]||'').trim();return s[0]+'\nSituation: '+v(0)+'\nTask: '+v(1)+'\nAction: '+v(2)+'\nResult: '+v(3);}).join('\n\n');
      copyText(all,e.target);
    };
  }
  if(id==='amc'){
    $('#gloss').innerHTML=GLOSS.map(g=>'<button class="fc" aria-pressed="false"><b>'+esc(g[0])+'</b><em>Click to see meaning</em><span>'+esc(g[1])+'</span></button>').join('');
    $$('.fc').forEach(c=>c.onclick=()=>{c.classList.toggle('flip');c.setAttribute('aria-pressed',c.classList.contains('flip'));});
  }
  if(id==='mock'){
    const q=$('#mockQ'),a=$('#mockA'),g=$('#mockGuide'),disp=$('#timerDisp'),tb=$('#mockTimer');
    const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    const stop=()=>{clearInterval(state.timer);state.timer=null;tb.textContent='Start 2 minute timer';};
    $('#mockNext').onclick=()=>{
      const cat=$('#mockCat').value;
      const pool=MOCK.filter(m=>cat==='All'||m.c===cat);
      let pick;do{pick=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&pick===state.mock);
      state.mock=pick;
      q.innerHTML='<span class="tag">'+esc(pick.c)+'</span><br>'+esc(pick.q);
      a.innerHTML='<p>'+esc(pick.a)+'</p>';g.open=false;
      stop();state.secs=120;disp.textContent=fmt(120);
    };
    tb.onclick=()=>{
      if(state.timer){stop();return;}
      state.secs=120;disp.textContent=fmt(120);tb.textContent='Stop timer';
      state.timer=setInterval(()=>{state.secs--;disp.textContent=fmt(Math.max(0,state.secs));if(state.secs<=0){stop();disp.textContent='0:00';}},1000);
    };
  }
}


function mountEditor(elId,key,text,opts){
  const el=$('#'+elId);if(!el)return;
  el.innerHTML='<textarea id="'+elId+'_t" style="min-height:'+(opts.h||'16rem')+'" data-keep="'+key+'" aria-label="'+esc(opts.label||'Editable text')+'"></textarea>'+
   '<div class="row"><button class="btn sm" data-a="cnt">Count words and time</button>'+(opts.brackets?'<button class="btn alt sm" data-a="br">Check unfilled [brackets]</button>':'')+'<button class="btn alt sm" data-a="cp">Copy</button><button class="btn alt sm" data-a="rs">Reset to original</button></div>'+
   '<p id="'+elId+'_m" aria-live="polite" style="color:var(--muted);font-size:.9rem;margin:.2rem 0 0"></p>';
  const ta=$('#'+elId+'_t'),msg=$('#'+elId+'_m');ta.value=text;
  $('[data-a=cnt]',el).onclick=()=>{const t=ta.value.trim(),w=t?t.split(/\s+/).length:0;msg.textContent=w+' words, about '+Math.round(w/130*60)+' seconds when spoken at a calm pace. '+(opts.target||'');};
  if(opts.brackets)$('[data-a=br]',el).onclick=()=>{const m=ta.value.match(/\[[^\]]*\]/g)||[];msg.textContent=m.length?m.length+' bracket(s) still to fill, for example: '+m.slice(0,3).join('  |  '):'No unfilled brackets left. Read it aloud once more.';};
  $('[data-a=cp]',el).onclick=e=>copyText(ta.value,e.target);
  $('[data-a=rs]',el).onclick=()=>{ta.value=text;state.keep[key]=text;msg.textContent='Reset to the original version.';};
}

/* ---------- navigation ---------- */
function renderNav(){
  let h='',last='';
  MODULES.forEach(m=>{
    if(m.g!==last){h+='<div class="grp">'+m.g+'</div>';last=m.g;}
    h+='<button class="nav-b'+(m.id===state.cur?' on':'')+'" data-go="'+m.id+'"'+(m.id===state.cur?' aria-current="page"':'')+'><span class="tick">'+(state.done.has(m.id)?'\u2713':'')+'</span><span>'+m.t+'</span></button>';
  });
  $('#nav').innerHTML=h;
  const n=state.done.size,t=MODULES.length;
  $('#barFill').style.width=(n/t*100)+'%';
  $('#progText').textContent=n+' of '+t+' topics done';
  $('#topProg').textContent=n+' / '+t+' done';
}
function go(id){
  if(!MODULES.some(m=>m.id===id))return;
  if(state.timer){clearInterval(state.timer);state.timer=null;}
  state.cur=id;render();
  $('#main').focus({preventScroll:true});window.scrollTo(0,0);
  $('#side').classList.remove('open');
}
function render(){
  const i=MODULES.findIndex(m=>m.id===state.cur),m=MODULES[i];
  const prev=MODULES[i-1],next=MODULES[i+1],done=state.done.has(m.id);
  $('#main').innerHTML='<article><h1>'+m.t+'</h1>'+m.html+
   '<div class="foot"><div>'+(prev?'<button class="btn alt" data-go="'+prev.id+'">Back: '+prev.t+'</button>':'')+'</div>'+
   '<div class="row"><button class="btn'+(done?' alt':'')+'" id="doneBtn">'+(done?'Marked done (click to undo)':'Mark this topic done')+'</button>'+(next?'<button class="btn" data-go="'+next.id+'">Next: '+next.t+'</button>':'')+'</div></div></article>';
  $('#doneBtn').onclick=()=>{state.done.has(m.id)?state.done.delete(m.id):state.done.add(m.id);render();};
  hydrateExercises();hydrateTopic(m.id);hydrateKeep();updateEngine();renderNav();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
render();loadEngine();
</script>
