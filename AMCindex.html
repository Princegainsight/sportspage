<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMC Support Engineer III: interview workbook</title>
<style>
:root{
  --paper:#F2F4F1; --panel:#FFFFFF; --ink:#17262B; --muted:#52666B; --line:#D3DCD9;
  --teal:#0E6B63; --teal-d:#0A524C; --teal-s:#DCEFEC;
  --amber:#8A4308; --amber-s:#FBEBD3; --rose:#B3243F; --rose-s:#F9E1E6;
  --code:#0F2A2E; --codeink:#E4F2EF; --codemute:#8FB3AE; --ok:#1B7A43; --ok-s:#DDF3E6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.25;color:var(--ink)}
h1{font-size:2rem;margin:0 0 .4rem}
h2{font-size:1.35rem;margin:2rem 0 .6rem}
h3{font-size:1.1rem;margin:1.4rem 0 .4rem}
p{margin:.6rem 0}
a{color:var(--teal-d)}
code{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:.9em;background:#E4EBE8;padding:.1em .35em;border-radius:4px}
pre{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:.88rem;background:var(--code);color:var(--codeink);padding:.9rem 1rem;border-radius:8px;overflow:auto;margin:.7rem 0;line-height:1.5}
pre code{background:none;padding:0;color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #E8A33D;outline-offset:2px}

.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{background:#E6ECE9;border-right:1px solid var(--line);padding:1.2rem 1rem 2rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.15rem;font-weight:700;line-height:1.3;margin-bottom:.8rem}
.brand small{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:.2rem}
.prog{margin:0 0 1rem}
.bar{height:8px;background:#CBD6D2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.prog span{font-size:.85rem;color:var(--muted)}
.grp{font-weight:700;font-size:.9rem;margin:1.1rem 0 .3rem;color:var(--teal-d)}
.nav-b{display:flex;gap:.5rem;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:.4rem .5rem;border-radius:6px;color:var(--ink);font-size:.95rem;line-height:1.35}
.nav-b:hover{background:#D6E2DE}
.nav-b.on{background:var(--teal);color:#fff}
.nav-b .tick{width:1.1rem;flex:none;color:var(--ok);font-weight:700}
.nav-b.on .tick{color:#CFF3E0}
.top{display:none}
main{padding:2rem clamp(1rem,4vw,3.5rem) 4rem;max-width:960px;width:100%}
.lead{font-size:1.08rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0}
.note{border-left:4px solid var(--teal);background:var(--teal-s);padding:.7rem 1rem;border-radius:0 8px 8px 0;margin:1rem 0}
.warn{border-left:4px solid var(--amber);background:var(--amber-s);padding:.7rem 1rem;border-radius:0 8px 8px 0;margin:1rem 0}
.note p:first-child,.warn p:first-child{margin-top:0}.note p:last-child,.warn p:last-child{margin-bottom:0}
ul,ol{padding-left:1.3rem;margin:.5rem 0}
li{margin:.25rem 0}
table{border-collapse:collapse;width:100%;margin:.8rem 0;background:var(--panel);font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .65rem;text-align:left;vertical-align:top}
th{background:#E6ECE9}
.tablewrap{overflow-x:auto}
.btn{background:var(--teal);color:#fff;border:0;border-radius:7px;padding:.5rem 1rem;font-weight:600}
.btn:hover{background:var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.alt:hover{background:var(--teal-s)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:.3rem .7rem;font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0;align-items:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:.6rem 0}
summary{cursor:pointer;padding:.65rem 1rem;font-weight:600}
summary:hover{background:#F0F5F3}
details[open]>summary{border-bottom:1px solid var(--line)}
.dbody{padding:.4rem 1rem .8rem}
.dbody p:first-child{margin-top:.5rem}
.foot{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line)}
label.f{display:block;font-weight:600;margin:.8rem 0 .2rem}
input[type=text],textarea,select{width:100%;font:inherit;padding:.5rem .65rem;border:1px solid #9FB1AD;border-radius:7px;background:#fff;color:var(--ink)}
textarea{min-height:5rem;resize:vertical}
.chk{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0}
.chk input{margin-top:.4rem;width:1.1rem;height:1.1rem;accent-color:var(--teal)}

/* SQL console, the one memorable element */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:1.1rem 0;overflow:hidden}
.ex .exq{padding:.9rem 1.1rem .5rem}
.ex .exq p{margin:.2rem 0}
.ex textarea.sql{background:var(--code);color:var(--codeink);border:0;border-radius:0;font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-size:.9rem;min-height:7rem;padding:.9rem 1.1rem;line-height:1.5;caret-color:#7FE0D0}
.ex .bar2{display:flex;flex-wrap:wrap;gap:.5rem;padding:.6rem 1.1rem;background:#16363B}
.ex .bar2 .btn.alt{background:transparent;color:#BFE4DE;border-color:#4F8179}
.ex .bar2 .btn.alt:hover{background:#21494F}
.out{padding:.7rem 1.1rem 1rem}
.out .msg{padding:.5rem .8rem;border-radius:7px;margin:.4rem 0}
.msg.ok{background:var(--ok-s);color:#0F5A30}.msg.bad{background:var(--rose-s);color:#7E1428}.msg.info{background:var(--teal-s);color:var(--teal-d)}
.out table{font-size:.85rem;margin:.4rem 0}
.out .sol{margin-top:.5rem}
.engine{padding:.5rem .9rem;border-radius:8px;margin:1rem 0;font-size:.93rem}
.engine.loading{background:var(--amber-s);color:var(--amber)}.engine.ready{background:var(--ok-s);color:#0F5A30}.engine.failed{background:var(--rose-s);color:#7E1428}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem;margin:1rem 0}
.fc{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:.9rem;min-height:7.5rem;text-align:left;color:var(--ink)}
.fc:hover{border-color:var(--teal)}
.fc b{display:block;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.05rem}
.fc span{display:none;font-size:.9rem;margin-top:.3rem;color:var(--ink)}
.fc.flip{background:var(--teal-s);border-color:var(--teal)}
.fc.flip span{display:block}
.fc em{font-style:normal;color:var(--muted);font-size:.85rem}
.fc.flip em{display:none}

/* flow */
.flow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:stretch;margin:1rem 0}
.flow div{flex:1 1 200px;background:var(--panel);border:1.5px solid var(--teal);border-radius:10px;padding:.8rem 1rem}
.flow div.mid{background:var(--code);color:var(--codeink);border-color:var(--code)}
.flow b{display:block}

.day{display:grid;grid-template-columns:90px 1fr;gap:.2rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;margin:.7rem 0}
.day h3{margin:0}
.day .links{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.big{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.05rem}
.timer{font-size:2rem;font-family:ui-monospace,Consolas,monospace}
.qbox{font-size:1.2rem;font-family:"Iowan Old Style",Palatino,Georgia,serif;padding:1rem 1.2rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:.8rem 0}
.tag{display:inline-block;font-size:.82rem;background:var(--teal-s);color:var(--teal-d);padding:.1rem .6rem;border-radius:99px;margin-bottom:.4rem}
.star-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.star-grid textarea{min-height:4.2rem}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 25% 0 0;z-index:20;height:100vh;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .top{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;background:#E6ECE9;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .day{grid-template-columns:1fr}
  .star-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><button class="btn sm" id="menuBtn" aria-controls="side">Menu</button><span id="topProg" style="font-size:.9rem"></span></div>
<div class="app">
  <aside class="side" id="side" aria-label="Workbook topics">
    <div class="brand">AMC Support Engineer III<small>5-day interview workbook</small></div>
    <div class="prog"><div class="bar"><i id="barFill"></i></div><span id="progText"></span></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<!-- ============ PRACTICE DATA AND EXERCISES ============ -->
<script id="content">
function genSetup(){
  let seed=20261013;
  const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};
  const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const fmt=(day,mins)=>new Date(Date.UTC(2026,9,day,0,0)+mins*60000).toISOString().slice(0,19).replace('T',' ');
  const cities=['Hyderabad','Bengaluru','Pune','Delhi','Mumbai'], devices=['mobile','desktop','tablet'];
  let s="CREATE TABLE campaigns(campaign_id INTEGER, name TEXT, channel TEXT);"+
    "INSERT INTO campaigns VALUES (1,'Diwali Sale','DSP'),(2,'Back to School','DSP'),(3,'Brand Keywords','Sponsored Ads'),(4,'Prime Day Teaser','Sponsored Ads');"+
    "CREATE TABLE users(user_id TEXT, city TEXT, device TEXT);"+
    "CREATE TABLE impressions(imp_id INTEGER, user_id TEXT, campaign_id INTEGER, imp_time TEXT);"+
    "CREATE TABLE clicks(click_id INTEGER, user_id TEXT, campaign_id INTEGER, click_time TEXT);"+
    "CREATE TABLE conversions(conv_id INTEGER, user_id TEXT, campaign_id INTEGER, conv_time TEXT, revenue INTEGER);";
  let imp=0,clk=0,cnv=0; const iv=[],cv=[],vv=[],uv=[];
  for(let u=1;u<=40;u++){
    const uid='u'+u;
    uv.push("('"+uid+"','"+cities[ri(0,4)]+"','"+devices[ri(0,2)]+"')");
    const n=ri(1,4);
    for(let k=0;k<n;k++){
      const camp=ri(1,4), day=ri(1,14), mins=ri(480,1380);
      const t=fmt(day,mins);
      imp++; iv.push("("+imp+",'"+uid+"',"+camp+",'"+t+"')");
      if(u%13===0 && k===0){ imp++; iv.push("("+imp+",'"+uid+"',"+camp+",'"+t+"')"); }
      if(rnd()<0.4){
        clk++; cv.push("("+clk+",'"+uid+"',"+camp+",'"+fmt(day,mins+ri(1,30))+"')");
        if(camp<4 && rnd()<0.45){ cnv++; vv.push("("+cnv+",'"+uid+"',"+camp+",'"+fmt(day+ri(0,3),mins+ri(40,900))+"',"+(ri(3,50)*100)+")"); }
      } else if(camp<4 && rnd()<0.08){
        cnv++; vv.push("("+cnv+",'"+uid+"',"+camp+",'"+fmt(day+ri(0,2),mins+ri(40,900))+"',"+(ri(3,50)*100)+")");
      }
    }
  }
  return s+"INSERT INTO users VALUES "+uv.join(',')+";INSERT INTO impressions VALUES "+iv.join(',')+";INSERT INTO clicks VALUES "+cv.join(',')+";INSERT INTO conversions VALUES "+vv.join(',')+";";
}

const EXERCISES={
 FREE:{kind:'free',q:'Your free practice console. Type any SELECT query and press Run. Try looking at each table.',start:`SELECT * FROM campaigns`},
 T1:{kind:'try',q:'Try this: look at the first 5 rows of impressions. Change 5 to 10 and run again.',start:`SELECT * FROM impressions LIMIT 5`},
 T2:{kind:'try',q:'Try this: clicks per campaign name, using a JOIN.',start:`SELECT c.name, COUNT(*) AS clicks
FROM clicks k
JOIN campaigns c ON c.campaign_id = k.campaign_id
GROUP BY c.name`},
 T2b:{kind:'try',q:'Try this: see how a join can multiply rows. Run this query, then replace it with the plain count in the comment and run again. The joined count is bigger even though we used a LEFT JOIN. Why? (Answer: if a user has 2 impressions and 2 clicks on the same campaign, the join gives 2 x 2 = 4 rows, not 2.)',start:`SELECT COUNT(*) AS rows_after_left_join
FROM impressions i
LEFT JOIN clicks k ON k.user_id = i.user_id AND k.campaign_id = i.campaign_id;

-- Now replace the query above with this one and run again:
-- SELECT COUNT(*) AS plain_impressions FROM impressions;`},
 T3:{kind:'try',q:'Try this: a CTE that counts impressions per day.',start:`WITH daily AS (
  SELECT date(imp_time) AS day, COUNT(*) AS n
  FROM impressions
  GROUP BY date(imp_time)
)
SELECT * FROM daily ORDER BY day`},
 T4:{kind:'try',q:'Try this: number each user\'s impressions in time order.',start:`SELECT user_id, imp_time,
       ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY imp_time) AS rn
FROM impressions
ORDER BY user_id, rn
LIMIT 12`},

 E11:{q:'List the names of all campaigns that run on the DSP channel.',hint:'Use WHERE with channel = \'DSP\'. Text values go in single quotes.',start:'',sol:`SELECT name FROM campaigns WHERE channel = 'DSP'`,expl:'WHERE filters rows before anything else happens.'},
 E12:{q:'Count the impressions for each campaign_id.',hint:'GROUP BY campaign_id and use COUNT(*).',start:'',sol:`SELECT campaign_id, COUNT(*) AS impressions FROM impressions GROUP BY campaign_id`,expl:'GROUP BY makes one row per campaign. COUNT(*) counts rows inside each group.'},
 E13:{q:'Show the campaign_ids that have more than __T__ impressions.',hint:'Filtering on a count needs HAVING, not WHERE.',start:'',sol:`SELECT campaign_id, COUNT(*) AS n FROM impressions GROUP BY campaign_id HAVING COUNT(*) > __T__`,expl:'WHERE filters rows before grouping. HAVING filters groups after grouping.'},
 E14:{q:'Find total revenue for each campaign_id from the conversions table. Put the highest revenue first. (The checker ignores row order, so check the order yourself.)',hint:'SUM(revenue), GROUP BY campaign_id, ORDER BY the total DESC.',start:'',sol:`SELECT campaign_id, SUM(revenue) AS total_revenue FROM conversions GROUP BY campaign_id ORDER BY total_revenue DESC`,expl:'Notice campaign 4 does not appear. It has no conversions at all.'},

 E21:{q:'Show each campaign name with its number of impressions. Use a JOIN.',hint:'JOIN impressions to campaigns on campaign_id, then GROUP BY the name.',start:'',sol:`SELECT c.name, COUNT(*) AS impressions FROM impressions i JOIN campaigns c ON c.campaign_id = i.campaign_id GROUP BY c.name`,expl:'Join first to get the name, then group.'},
 E22:{q:'Find the users who have seen at least one impression but never clicked anything.',hint:'LEFT JOIN impressions to clicks on user_id, then keep rows where the click is NULL. Use DISTINCT.',start:'',sol:`SELECT DISTINCT i.user_id FROM impressions i LEFT JOIN clicks c ON c.user_id = i.user_id WHERE c.click_id IS NULL`,expl:'A LEFT JOIN keeps all left rows. Where no match exists, right-side columns are NULL. Use IS NULL, never = NULL.'},
 E23:{q:'Find the click-through rate (clicks divided by impressions) for each campaign name, rounded to 3 decimals. Include campaigns with zero clicks.',hint:'Count impressions and clicks in separate subqueries, then join the two results. Joining the raw tables directly will multiply rows.',start:'',sol:`SELECT c.name, ROUND(1.0 * COALESCE(k.n,0) / i.n, 3) AS ctr
FROM campaigns c
JOIN (SELECT campaign_id, COUNT(*) AS n FROM impressions GROUP BY campaign_id) i ON i.campaign_id = c.campaign_id
LEFT JOIN (SELECT campaign_id, COUNT(*) AS n FROM clicks GROUP BY campaign_id) k ON k.campaign_id = c.campaign_id`,expl:'Aggregate each many-side table first, then join. This avoids fan-out. 1.0 * forces decimal division.'},
 E24:{q:'Find total revenue by user city. Highest first.',hint:'JOIN conversions to users on user_id, GROUP BY city.',start:'',sol:`SELECT u.city, SUM(v.revenue) AS revenue FROM conversions v JOIN users u ON u.user_id = v.user_id GROUP BY u.city ORDER BY revenue DESC`,expl:'One user can have many conversions, but each conversion has exactly one user, so this join does not inflate revenue.'},

 E31:{q:'Find the reach (number of unique users) for each campaign_id based on impressions.',hint:'COUNT(DISTINCT user_id).',start:'',sol:`SELECT campaign_id, COUNT(DISTINCT user_id) AS reach FROM impressions GROUP BY campaign_id`,expl:'Impressions count every showing. Reach counts each person once.'},
 E32:{q:'Show two numbers in one row: the raw number of impression rows, and the number after removing duplicates (same user_id, campaign_id and imp_time).',hint:'Use a subquery with SELECT DISTINCT user_id, campaign_id, imp_time and count its rows.',start:'',sol:`SELECT COUNT(*) AS raw_rows, (SELECT COUNT(*) FROM (SELECT DISTINCT user_id, campaign_id, imp_time FROM impressions)) AS deduped_rows FROM impressions`,expl:'Duplicate event rows are a classic cause of inflated numbers. Always ask: is this table unique at the level I think it is?'},
 E33:{q:'Group conversions into High (revenue 2000 or more), Medium (1000 to 1999) and Low (below 1000). Show the bucket name and how many conversions fall in each.',hint:'CASE WHEN ... THEN ... ELSE ... END, and GROUP BY the CASE expression (or its position, GROUP BY 1).',start:'',sol:`SELECT CASE WHEN revenue >= 2000 THEN 'High' WHEN revenue >= 1000 THEN 'Medium' ELSE 'Low' END AS bucket, COUNT(*) AS n FROM conversions GROUP BY 1`,expl:'CASE is SQL\'s if-else. WHEN conditions are checked top to bottom.'},
 E34:{q:'Using a CTE, find users who converted within 7 days after their first click on the same campaign. Show each user_id once.',hint:'CTE: first click per user and campaign (MIN(click_time)). Then join conversions on user_id and campaign_id and check julianday(conv_time) - julianday(first_click) BETWEEN 0 AND 7.',start:'',sol:`WITH first_click AS (
  SELECT user_id, campaign_id, MIN(click_time) AS first_click FROM clicks GROUP BY user_id, campaign_id
)
SELECT DISTINCT v.user_id
FROM conversions v
JOIN first_click f ON f.user_id = v.user_id AND f.campaign_id = v.campaign_id
WHERE julianday(v.conv_time) - julianday(f.first_click) BETWEEN 0 AND 7`,expl:'This is a mini attribution window. In AMC the date function will be different (see the cheat sheet), but the logic is the same.'},

 E41:{q:'Rank campaigns by total revenue, highest first. Show campaign_id, revenue and the rank.',hint:'RANK() OVER (ORDER BY SUM(revenue) DESC) together with GROUP BY campaign_id.',start:'',sol:`SELECT campaign_id, SUM(revenue) AS revenue, RANK() OVER (ORDER BY SUM(revenue) DESC) AS rnk FROM conversions GROUP BY campaign_id`,expl:'Window functions run after grouping, so they can use aggregates like SUM.'},
 E42:{q:'For each user, show the campaign and time of their very first impression. One row per user.',hint:'ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY imp_time, imp_id) in a CTE, then keep rn = 1.',start:'',sol:`WITH x AS (
  SELECT user_id, campaign_id, imp_time,
         ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY imp_time, imp_id) AS rn
  FROM impressions
)
SELECT user_id, campaign_id, imp_time FROM x WHERE rn = 1`,expl:'This is the standard "first row per group" pattern. Learn it by heart. It is also the standard way to deduplicate.'},
 E43:{q:'Show daily revenue and the running total of revenue, day by day (use the date part of conv_time). Order by day.',hint:'First group by date(conv_time). Then SUM(daily) OVER (ORDER BY day).',order:true,start:'',sol:`SELECT day, daily, SUM(daily) OVER (ORDER BY day) AS running
FROM (SELECT date(conv_time) AS day, SUM(revenue) AS daily FROM conversions GROUP BY date(conv_time))
ORDER BY day`,expl:'A running total is SUM() OVER (ORDER BY ...). Here the checker also checks row order.'},
 E44:{q:'For every click, show user_id, click_time and the gap in minutes since the same user\'s previous click (rounded to 0 decimals). The first click of a user will have NULL.',hint:'LAG(click_time) OVER (PARTITION BY user_id ORDER BY click_time). Minutes = (julianday(a) - julianday(b)) * 1440.',start:'',sol:`SELECT user_id, click_time,
       ROUND((julianday(click_time) - julianday(LAG(click_time) OVER (PARTITION BY user_id ORDER BY click_time))) * 1440, 0) AS gap_min
FROM clicks`,expl:'LAG looks at the previous row inside the same partition. First row has no previous row, so it gives NULL.'},

 B1:{q:'Customer says: "Revenue per campaign looks far too high." Fix this query so each conversion is counted only once.',hint:'Do you need the impressions table at all? Every extra join to a "many" table multiplies rows.',start:`SELECT c.name, SUM(v.revenue) AS revenue
FROM campaigns c
JOIN impressions i ON i.campaign_id = c.campaign_id
JOIN conversions v ON v.campaign_id = c.campaign_id
GROUP BY c.name`,sol:`SELECT c.name, SUM(v.revenue) AS revenue FROM campaigns c JOIN conversions v ON v.campaign_id = c.campaign_id GROUP BY c.name`,expl:'Each conversion was repeated once for every impression in the same campaign. This is fan-out.'},
 B2:{q:'Customer wants the number of conversions above 1000 revenue for EVERY campaign, including campaigns with zero such conversions. This query silently drops some campaigns. Fix it.',hint:'The WHERE on the right-hand table removes the NULL rows created by the LEFT JOIN. Move the condition into the ON clause.',start:`SELECT c.name, COUNT(v.conv_id) AS big_conversions
FROM campaigns c
LEFT JOIN conversions v ON v.campaign_id = c.campaign_id
WHERE v.revenue > 1000
GROUP BY c.name`,sol:`SELECT c.name, COUNT(v.conv_id) AS big_conversions FROM campaigns c LEFT JOIN conversions v ON v.campaign_id = c.campaign_id AND v.revenue > 1000 GROUP BY c.name`,expl:'A WHERE condition on the right table turns a LEFT JOIN into an INNER JOIN. Put right-table filters in ON.'},
 B3:{q:'Customer asks for impressions on 5 October 2026 but gets 0. Fix the query.',hint:'imp_time has date and time. Does it ever equal exactly \'2026-10-05\'?',start:`SELECT COUNT(*) AS imps
FROM impressions
WHERE imp_time = '2026-10-05'`,sol:`SELECT COUNT(*) AS imps FROM impressions WHERE date(imp_time) = '2026-10-05'`,expl:'Comparing a timestamp with a date matches only midnight. Convert to date, or use a range: >= start AND < next day.'},
 B4:{q:'Customer says "unique users who clicked" looks higher than the number of users. Fix it.',hint:'COUNT(user_id) counts rows, not people.',start:`SELECT COUNT(user_id) AS users_clicked
FROM clicks`,sol:`SELECT COUNT(DISTINCT user_id) AS users_clicked FROM clicks`,expl:'COUNT(col) counts non-NULL rows. For unique people use COUNT(DISTINCT col).'},

 BT1:{kind:'try',q:'Try this: look at the whole campaigns table. This is the simplest query in SQL. The star means "all columns".',start:`SELECT * FROM campaigns`},
 BT2:{kind:'try',q:'Try this: choose only some columns, and give them new names with AS. Then change the names, or add one more column.',start:`SELECT name AS campaign_name, channel AS ad_type
FROM campaigns`},
 BT3:{kind:'try',q:'Try this: sort the conversions. Change DESC to ASC and see what changes.',start:`SELECT conv_id, revenue
FROM conversions
ORDER BY revenue DESC`},
 BT4:{kind:'try',q:'Try this: DISTINCT removes repeats. Run it, then remove the word DISTINCT and run again. Compare both results.',start:`SELECT DISTINCT device
FROM users`},
 BT5:{kind:'try',q:'Try this: WHERE keeps only the rows that match. Change the city to Pune and run again.',start:`SELECT user_id, city, device
FROM users
WHERE city = 'Hyderabad'`},

 A8:{q:'Count the clicks that happened from 3 October 2026 to 5 October 2026, both days included.',hint:'click_time has date and time, so use date(click_time) with BETWEEN.',start:'',sol:`SELECT COUNT(*) FROM clicks WHERE date(click_time) BETWEEN '2026-10-03' AND '2026-10-05'`,expl:'date() removes the time part, so all clicks of 5 October are included.'},

 A12:{q:'How many users live in each city?',hint:'GROUP BY city, and COUNT(*).',start:'',sol:`SELECT city, COUNT(*) FROM users GROUP BY city`,expl:'GROUP BY makes one row per city, and COUNT(*) counts the rows inside each group.'},
 A13:{q:'Show the user_id and the number of impressions for users who saw 4 or more impressions.',hint:'Group by user_id. To filter on a count after grouping, use HAVING.',start:'',sol:`SELECT user_id, COUNT(*) FROM impressions GROUP BY user_id HAVING COUNT(*) >= 4`,expl:'WHERE filters rows before grouping. HAVING filters groups after grouping.'},

 A15:{q:'Show every campaign name with its number of conversions. Campaigns with no conversions must show 0.',hint:'LEFT JOIN from campaigns, and use COUNT(v.conv_id), not COUNT(*).',start:'',sol:`SELECT c.name, COUNT(v.conv_id) FROM campaigns c LEFT JOIN conversions v ON v.campaign_id = c.campaign_id GROUP BY c.name`,expl:'COUNT(*) would count the empty row as 1. COUNT(v.conv_id) skips NULLs, so it gives 0.'},

const PRIO_ANS=`When I have many cases at the same time, I do a quick triage first, usually in the first 15 to 20 minutes. I sort every case on four things.

First, business impact. Is a production campaign or a customer launch affected right now? A live failure always comes before a how-to question.

Second, deadline and SLA. I check which cases are close to breaching SLA, or have a customer event coming up.

Third, blockers. If a case needs engineering or another team, I raise it early, because that waiting time is outside my control. While they work, I move on to my other cases.

Fourth, effort. If something is a quick fix of 10 or 15 minutes, I finish it straight away, so the customer is unblocked and my list becomes shorter.

For the cases that must wait, I send a short update with the next time they will hear from me, so nobody is left guessing. And I re-check the list a few times a day, because priorities change.

{id:'start',g:'Begin',t:'Start here',html:`
<p class="lead">This workbook is made for your Amazon AMC Support Engineer III interview: one screening round, then four more rounds. Click through the topics, practise in the SQL console, and mark each topic done. New: the "from zero" topics start every subject from the very basics.</p>

{id:'starwhat',g:'Screening round',t:'What is a STAR story?',html:`
<p class="lead">STAR comes up again and again in Amazon preparation. This topic explains what it is and why. Read it once before you write your own stories.</p>
<h2>What is a STAR story?</h2>
<p>STAR is a simple way to answer behavioural questions, the ones that start with "Tell me about a time when...". It stands for four parts:</p>
${tbl(['Letter','Meaning','What you say','Time'],[['<b>S</b>ituation','The background','Where, when and what was happening','10 to 15 seconds'],['<b>T</b>ask','Your responsibility','What you had to achieve','About 10 seconds'],['<b>A</b>ction','What you did','The steps you took, using "I"','60 to 70 seconds'],['<b>R</b>esult','The outcome','Numbers, and what you learnt','About 20 seconds']])}
<h2>A small example</h2>
<div class="card"><p><b>Situation:</b> A client's email campaign was failing a few hours before the send.</p><p><b>Task:</b> I was the technical contact, so I had to make sure it went out on time.</p><p><b>Action:</b> I checked the logs, found that the audience query was returning zero rows, rewrote the filter, tested on a small segment, and told the client exactly what I changed.</p><p><b>Result:</b> The campaign went out on time, and I added the case to our knowledge base so the team could reuse the fix.</p></div>
<h2>Why does it come up every time?</h2>
<ol>
<li><b>Amazon interviews are built on behavioural questions.</b> Amazon has Leadership Principles like Customer Obsession, Dive Deep and Ownership. For each one, the interviewer asks "Tell me about a time you...". So in almost every round, you answer in this format.</li>
<li><b>They want proof, not opinions.</b> Anyone can say "I am a good problem solver". A real story with actions and numbers shows what you actually did.</li>
<li><b>Past behaviour predicts future behaviour.</b> Interviewers believe that how you handled situations before is the best sign of how you will handle them at Amazon.</li>
<li><b>It keeps your answer organised.</b> Under pressure, people ramble. STAR gives you a clear path, so you do not forget the result or spend too long on the background.</li>
<li><b>Every round is scored on the same principles.</b> Interviewers compare notes later. Clear, structured stories are easy to score well.</li></ol>
<h2>Three tips</h2>
<ul><li><b>Action is the main part.</b> Say "I did this", not "we did this". They are hiring you, not your team.</li><li><b>End with a result.</b> Many people stop after the action. Give a number and one lesson.</li><li><b>Prepare 6 to 8 stories in advance.</b> One good story can answer many questions. For example, the same story can fit Dive Deep and Ownership.</li></ul>
<h2>Check your story before telling it</h2>
<label class="chk"><input type="checkbox" data-keep="sw1"> It is a real case that happened to me.</label>
<label class="chk"><input type="checkbox" data-keep="sw2"> The situation takes me less than 20 seconds.</label>
<label class="chk"><input type="checkbox" data-keep="sw3"> I say "I", not "we", in the action part.</label>
<label class="chk"><input type="checkbox" data-keep="sw4"> It has at least one number (time, count, percentage).</label>
<label class="chk"><input type="checkbox" data-keep="sw5"> It ends with a result and one lesson.</label>
<label class="chk"><input type="checkbox" data-keep="sw6"> It takes about 2 minutes to say.</label>
<p>Next, see your own real stories: ${goBtn('story18','Your 18-ticket story')} and ${goBtn('star','Story builder')}.</p>`},

{id:'lp',g:'Screening round',t:'Leadership Principles',html:`
<p class="lead">Amazon interviews are built around Leadership Principles. Every round will test two or three of them. These are the ones that matter most for a support role.</p>
${LPS.map(x=>det(x.n,`<p><b>In support work:</b> ${x.m}</p><p><b>Likely question:</b> ${x.q}</p><p><b>Story idea from your own work:</b> ${x.a}</p><p><b>Follow-ups to expect:</b> ${x.p}</p>`)).join('')}
<h2>STAR method</h2>
<ul><li><b>Situation:</b> one or two sentences of context. Not more.</li><li><b>Task:</b> what was your responsibility.</li><li><b>Action:</b> what <i>you</i> did, step by step. Say "I", not "we". This is 60 percent of the answer.</li><li><b>Result:</b> the outcome with numbers, and what you learnt.</li></ul>
<h2>Rules that save you</h2>
<ul><li>Use only real stories. Interviewers will dig 3 or 4 levels deep.</li><li>Prepare 6 to 8 stories, and map each to two principles so you can reuse them.</li><li>Include data: time saved, tickets reduced, customers affected.</li><li>Include a story with a failure. Amazon likes honesty.</li></ul>
<p>Next, write your stories in the ${goBtn('star','Story builder')}.</p>`},

{id:'prio',g:'Screening round',t:'Prioritisation: many cases at once',html:`
<p class="lead">"How do you prioritise when you have many cases?" is a very common support interview question. Give a clear method, then back it with a real example.</p>
<h2>The four things to check</h2>
${tbl(['Factor','Question to ask yourself','Example'],[['Business impact','Is a live campaign or a customer launch affected right now?','A failing send today comes before a how-to question.'],['Deadline and SLA','What will breach SLA soon? Is there a customer event?','A report due tomorrow morning moves up.'],['Blockers','Do I need engineering or another team?','Raise it early, so waiting time runs in parallel.'],['Effort','Is it a quick fix of 10 to 15 minutes?','Finish it straight away, and clear the list.']])}
<h2>Your answer (edit it in your own words)</h2>
<p>Takes about 90 seconds. The last line comes from your resume, so keep it only if it is true for you.</p>
<div id="prioBox"></div>
<h2>Practice: put these six tickets in order</h2>
<p>Look at the list, decide your order, then open the answer.</p>
<ol><li>A live campaign send is failing. It is scheduled in 3 hours.</li><li>A how-to question about creating a template.</li><li>A customer's query returns a wrong count. Their report is due tomorrow morning.</li><li>An intermittent error that needs engineering. No deadline.</li><li>A 10-minute access fix.</li><li>A follow-up on a closed case, asking for documentation.</li></ol>
${det('Suggested order and reasons',`<ol><li><b>Ticket 1 first.</b> Live impact and a hard deadline.</li><li><b>Ticket 4: raise it with engineering right away.</b> It takes you only a few minutes to send, and then their waiting time runs while you work on others.</li><li><b>Ticket 5, the quick fix.</b> Ten minutes, and it unblocks a customer. Do it before or just after ticket 1, depending on the SLA.</li><li><b>Ticket 3.</b> Deadline is tomorrow, so work on it today, after the urgent ones.</li><li><b>Tickets 2 and 6 last.</b> Low impact. Send a short update with the time they will hear from you.</li></ol><p>There is no single right order. Interviewers listen for your reasons.</p>`)}
<h2>A Bias for Action story (example only)</h2>
${warn(`<p>This is an illustration. Use your real story from the next topic, because interviewers dig deep into details.</p>`)}
<div class="card"><p><b>Situation:</b> One Monday morning I had 8 to 10 open cases across my enterprise accounts. One client had a campaign workflow failing, with an email send scheduled that afternoon. I did not yet know the root cause.</p><p><b>Task:</b> I was the main technical contact. I had to protect the client's send, keep my other cases within SLA, and I could not wait for a full investigation.</p><p><b>Action:</b> I sorted my cases by impact and deadline. I gave the client a safe, reversible workaround first, so the send could go on time, and I told them clearly what was done and when I would update next. I raised the blocked case with engineering early, and sent short status messages on the other cases. After the send, I traced the real cause and built a repro for engineering.</p><p><b>Result:</b> The send went out on time and all my cases stayed within SLA. I learnt to separate "unblock the customer now" from "fix the cause properly", and I follow this order for every high-impact case.</p></div>
<h2>Mistakes to avoid</h2>
<ul><li>Do not say "I work on whatever comes first". It sounds unstructured.</li><li>Do not say "everything is urgent". Interviewers want to hear how you choose.</li><li>Do not hide the trade-off. Say what you delayed and how you told the customer.</li></ul>
<h2>Follow-ups to expect</h2>
<ul><li>What information were you missing when you decided?</li><li>What was the risk of your workaround, and how did you reduce it?</li><li>What if the client did not accept the workaround?</li><li>How did you decide the other cases could wait?</li></ul>
<p>Now see your real story: ${goBtn('story18','18 tickets in one day')}.</p>`},

{id:'story18',g:'Screening round',t:'Your story: 18 tickets in one day',html:`
<p class="lead">This is your real GlobalLogic story: normally 3 to 4 tickets a day, and 18 on the day when all teammates were on leave. It fits Bias for Action, Ownership and prioritisation.</p>
${warn(`<p>Only the facts you told me are written as facts. Everything in [square brackets] is for you to fill in truthfully. If you do not remember a number, say so honestly or use a rough range. Interviewers will test the details.</p>`)}
<h2>Your draft (edit it freely)</h2>
<div id="s18box"></div>
<h2>Answer these questions first, in the boxes</h2>
<p>Write short notes. They help you fill the brackets with real details.</p>
<label class="f" for="s18q1">1. What types of tickets were there (workflow errors, template issues, API problems)?</label><textarea id="s18q1" data-keep="s18q1"></textarea>
<label class="f" for="s18q2">2. Was any ticket critical, like a live campaign or a client deadline? What happened?</label><textarea id="s18q2" data-keep="s18q2"></textarea>
<label class="f" for="s18q3">3. How did you decide the order? What did you do first?</label><textarea id="s18q3" data-keep="s18q3"></textarea>
<label class="f" for="s18q4">4. How many did you finish that day? How many carried over, and what did you tell those clients?</label><textarea id="s18q4" data-keep="s18q4"></textarea>
<label class="f" for="s18q5">5. Did you tell your manager? Did anyone help you?</label><textarea id="s18q5" data-keep="s18q5"></textarea>
<label class="f" for="s18q6">6. Did you miss any SLA? If yes, what did you do about it? (Saying this honestly makes the story believable.)</label><textarea id="s18q6" data-keep="s18q6"></textarea>
<label class="f" for="s18q7">7. Did anything change afterwards, like feedback, a process, or a knowledge base article?</label><textarea id="s18q7" data-keep="s18q7"></textarea>
<h2>Why this story is good for Amazon</h2>
<ul><li><b>Bias for Action:</b> you acted fast under pressure without waiting for instructions.</li><li><b>Ownership:</b> nobody else was there, and you did not say "not possible".</li><li><b>Customer Obsession:</b> no critical client was left without a response.</li><li><b>Dive Deep:</b> if you still checked each issue properly under load, say it.</li></ul>
<h2>Follow-up questions to expect</h2>
${det('How did you decide which ticket came first?',`<p>Use the four factors: business impact, deadline or SLA, blockers, effort. Give one real example from that day.</p>`)}
${det('Did any ticket suffer because of your choices? What did you do?',`<p>Be honest. Name the ticket that waited, say how you informed the client, and how you made it up.</p>`)}
${det('What would you do if two tickets were equally urgent?',`<p>Check which one has a hard deadline or more users affected. Ask the client if you can. Update the other client with a clear next time. If still equal, take the quicker one first.</p>`)}
${det('Why were all teammates on leave on the same day?',`<p>This can be a trap. Stay calm and positive. Say it was a planning gap, you raised it with your manager as a point to improve (only if you did), and you did not blame anyone.</p>`)}
${det('What did you learn and what do you do differently now?',`<p>Example: a few minutes of triage at the start saves hours later. And I now keep a short list of quick fixes and a clear template for status updates. Say only what is true.</p>`)}
<h2>Tips for saying it</h2>
<ul><li>Say the numbers clearly: "3 to 4 tickets normally, 18 that day".</li><li>Spend most of the time on Action, and say "I" throughout.</li><li>Do not blame teammates or manager. Keep the tone positive.</li><li>Be honest. If only 14 of the 18 were finished, say 14.</li></ul>`},

{id:'star',g:'Screening round',t:'Story builder',html:`
<p class="lead">Write one story for each principle. Use real cases from Epsilon, GlobalLogic and Gainsight. When you press combine, you will see the full answer and how long it takes to speak. Aim for 2 minutes (about 260 words).</p>
<h2>Story starters from your resume</h2>
<p>These are real items from your resume. Pick one for each principle, then add your own details in the boxes below.</p>
<div class="tablewrap"><table><tr><th>From your resume</th><th>Good for</th><th>What to add</th></tr>
<tr><td>Automate Hub (Epsilon)</td><td>Invent and Simplify, Ownership</td><td>The repeated bottleneck, why you built it on your own time, how 10 to 15 percent was measured.</td></tr>
<tr><td>Instance Review Application (Gainsight)</td><td>Invent and Simplify, Bias for Action</td><td>The manual process, your part vs your teammate's, a real before and after time.</td></tr>

<tr><td>SQL segmentation and template debugging (GlobalLogic)</td><td>Dive Deep, Customer Obsession</td><td>A client case that led to the 30 percent drop in client-facing errors.</td></tr>
<tr><td>18 tickets in one day, teammates on leave (GlobalLogic)</td><td>Bias for Action, Ownership, prioritisation</td><td>Your real triage steps and numbers. Open the 18-ticket story topic.</td></tr>
<tr><td>PX MCP connector and PX-CS integration (Gainsight)</td><td>Ownership, Dive Deep</td><td>A data-not-flowing case traced back to the source, with engineering.</td></tr>
<tr><td>SLA and CSAT above 95 percent (GlobalLogic)</td><td>Customer Obsession</td><td>A tense case you turned around, and what you did beyond the ticket.</td></tr>

{id:'ask',g:'Screening round',t:'Questions to ask',html:`
<p class="lead">At the end of every round they ask "Do you have any questions for us?" Always ask two. It shows interest in the work.</p>
<h2>For the recruiter (now)</h2>
<ul><li>How many rounds are technical and how many behavioural?</li><li>Will there be a SQL or coding exercise? Live or take-home?</li><li>Will all rounds be on the same day, and how long is each?</li><li>Is there a Bar Raiser round?</li><li>What are the shift timings and support channels (phone, chat, email) for this team?</li><li>When can I expect feedback after the final round?</li></ul>
<h2>For the hiring manager</h2>
<ul><li>What are the top types of cases the AMC support team sees today?</li><li>What does success look like in the first 90 days?</li><li>How does the team work with engineering when a defect is found?</li><li>What tools is the team building to scale support?</li></ul>
<h2>For peers</h2>
<ul><li>What was the most interesting AMC case you handled recently?</li><li>How do you keep up with new features?</li><li>What do new joiners usually find hardest?</li></ul>`},

{id:'amc',g:'AMC technical',t:'AMC and ad-tech basics',html:`
<p class="lead">You do not need to be an ad-tech expert. You need to explain AMC simply, know the vocabulary, and understand what analysts try to do with it.</p>
<h2>AMC in two sentences</h2>
<div class="card"><p>Amazon Marketing Cloud is a secure, privacy-safe cloud environment where advertisers run SQL analytics across pseudonymized datasets. They can combine their own data with Amazon Ads events like impressions, clicks and conversions to measure campaigns, refine audiences and optimise supply, without seeing individual users.</p></div>
<div class="flow"><div><b>Data in</b>Advertiser\'s own data plus Amazon Ads events (impressions, clicks, conversions)</div><div class="mid"><b>AMC clean room</b>Analysts write SQL. Privacy rules apply</div><div><b>Results out</b>Aggregated insights, and audiences for campaigns</div></div>
<h2>What the support engineer does</h2>
<ul><li>Helps data analysts write, fix and understand queries.</li><li>Finds root cause: query mistake, configuration, data, or product defect.</li><li>Builds repro cases and escalates to engineering.</li><li>Writes tutorials, sample queries and documentation for the community.</li><li>Builds tools to reduce repeat issues.</li></ul>
<h2>Your resume link</h2>
<p>At GlobalLogic and Epsilon you debugged SQL audience segmentation queries for marketers. AMC analysts also build and refine audiences with SQL, but on advertising data. You can say: \"I have debugged audience queries and data issues for marketing teams. In AMC I will do that for analysts, on much bigger advertising datasets.\" Use this as your own framing.</p>
<h2>Flashcards: click a card to see the meaning</h2>
<div class="cards" id="gloss"></div>
${note(`<p>Details like table names, paid features and thresholds were taken from the job description and third-party guides. Open the official AMC documentation and its example query library at least once before your interview.</p>`)}
<h2>Go deeper</h2>
<div class="row">${goBtn('amcwhat','What it is')}${goBtn('amctime','Launch and timeline')}${goBtn('amcuse5','Top 5 use cases')}${goBtn('amchow','How it functions')}${goBtn('amcconfig','Configuration')}${goBtn('amchelp','How it helps')}${goBtn('amcqa','Interview Q and A')}</div>`},

{id:'amcwhat',g:'AMC technical',t:'AMC deep dive 1: what it is',html:`
<p class="lead">This topic builds a strong understanding of the product itself. By the end you should be able to explain AMC to an analyst, a marketer, or an interviewer.</p>
<h2>AMC in one paragraph</h2>
<div class="card"><p>Amazon Marketing Cloud (AMC) is a secure, privacy-safe cloud environment built by Amazon Ads. Advertisers use SQL to analyse pseudonymized event data: Amazon Ads campaign events (impressions, clicks, conversions) together with shopping, browsing and streaming signals, and the advertiser's own data. The results come back only as aggregated tables, never as lists of individual people. Advertisers use it for measurement, deeper insights, and building audiences.</p></div>
<h2>What is a clean room? A simple picture</h2>
<p>Imagine a sealed kitchen. Amazon brings its ingredients (ad and shopping signals). The advertiser brings theirs (their own customer data). You can cook inside the kitchen (write SQL queries) and take out only the finished dish (aggregated results). Nobody can walk out with the other side's raw ingredients (individual-level data).</p>
<h2>What goes into AMC</h2>
${tbl(['Input','What it is','Examples'],[['Amazon Ads events','Records of ads served and what followed','Impressions, clicks, conversions from Amazon DSP and sponsored ads'],['Amazon signals','Shopping, browsing and streaming signals connected to those ads','Purchases, detail page views (availability depends on features and region)'],['Advertiser first-party data','Data the advertiser owns, uploaded with hashed identifiers','CRM records, offline sales, website events'],['Partner or provider data','Data onboarded through approved partners','Depends on the instance setup']])}
<h2>What AMC is not</h2>
<ul><li><b>Not a data warehouse or CDP.</b> It is a constrained analysis environment built around Amazon Ads signals.</li><li><b>Not real time.</b> Data arrives with a delay, so it is for analysis, not live monitoring.</li><li><b>Not a place to download customer lists.</b> Row-level output is blocked by design.</li><li><b>Not only for experts.</b> There are templates and no-code options, but custom insight needs SQL.</li></ul>
<h2>Who uses it</h2>
<ul><li>Brands and sellers advertising on Amazon.</li><li>Agencies working for those brands.</li><li>Ad-tech tool providers who build products on top of AMC, such as reporting and automation tools.</li><li>Access widened over time. Reports from 2025 say advertisers who buy Sponsored Ads can now use AMC through the Amazon Ads console, with a homepage of no-code analysis templates.</li></ul>
<h2>AMC vs the standard Amazon Ads console</h2>
${tbl(['Question','Standard console reports','AMC'],[['Campaign totals (clicks, spend, sales)','Yes','Yes'],['Customer journey across many ads','Limited','Strong, you query it yourself'],['Attribution logic','Fixed models','You can define your own'],['Overlap and frequency across channels','Limited','Strong'],['Custom audiences from your own logic','Limited','Yes, query-based audiences'],['Skills needed','Low','SQL for custom work']])}
<h2>Where AMC sits</h2>
<p>AMC works alongside Amazon DSP, Sponsored Ads, and the Amazon Ads API. It runs on Amazon's cloud infrastructure, and a version of it is also offered inside AWS Clean Rooms for advertisers who keep their first-party data in their own AWS account.</p>
<h2>Quick check</h2>
${det('Why can AMC never give me a list of customers?',`<p>Because it is a clean room. Output is aggregated, and rows with too few users are removed. This protects individual privacy for both Amazon and the advertiser.</p>`)}
${det('How is AMC different from the Amazon Ads console?',`<p>The console gives fixed reports and totals. AMC gives event-level data in SQL, so you can ask custom questions, apply your own attribution, study overlap and journeys, and build audiences.</p>`)}
${det('What data can I combine in AMC?',`<p>Amazon Ads events and signals, plus your own first-party data uploaded with hashed identifiers, and data from approved partners.</p>`)}
${srcList(['amcsp','adw','ppc'])}
`},

{id:'amctime',g:'AMC technical',t:'AMC deep dive 2: launch and timeline',html:`
<p class="lead">Launch dates for AMC are reported differently across sources. This is normal for a product that went through a beta. Here is the clear picture, with the sources.</p>
${warn(`<p><b>When was AMC launched?</b> Amazon's own news pages say it launched in <b>2019</b>. A trade site reports that the beta opened to eligible agencies, advertisers and tool providers in North America, Europe, Japan and Australia on <b>5 January 2021</b>. AdExchanger reported on <b>26 October 2021</b> that AMC launched out of beta, with Amazon DSP integration. Some blogs say 2020. In an interview, a safe answer is: "Amazon says 2019, with a wider beta in 2021 and a full launch from beta in late 2021."</p>`)}
<h2>Timeline</h2>
${tbl(['When','What happened','Source type'],[
['2017','Google announces Ads Data Hub beta, which set the clean room model for advertising.','Trade site'],
['2019','Amazon says AMC launched.','Official Amazon'],
['5 Jan 2021','AMC beta opens to eligible agencies, advertisers and tool providers in several regions.','Trade site'],
['26 Oct 2021','AMC moves out of beta. Marketers can use it with Amazon DSP for measurement and analytics. Amazon did not require an AWS account for advertisers.','Trade press (AdExchanger)'],
['Oct 2022','Amazon promotes AMC at its unBoxed conference as central to its advertising plans. Brands use it mainly for attribution and analytics.','Trade press'],
['2023','Amazon announces a clean room for publishers (sell side), separate from AMC.','Trade press'],
['31 Jul 2024','AMC on AWS Clean Rooms becomes available. Advertisers can match first-party data in their own AWS account without moving it.','Official Amazon'],
['7 Jan 2025','Brands can query up to five years of their Amazon store purchase signals for measurement use cases, up from 13 months.','Official Amazon'],
['2025','Advertisers who buy Sponsored Ads get access through the Amazon Ads console, with no-code templates.','Official Amazon and Adweek']])}
<p>One trade site also reports further changes in 2026, such as new first-party data tools and a single global advertiser account. These are recent, so check Amazon's announcements before mentioning them.</p>
<h2>Why was AMC built?</h2>
<ul><li>Advertisers wanted to measure the whole journey, not just last-click results.</li><li>Privacy rules and browser changes made sharing user-level data risky, so a clean room became the safer way to analyse combined data.</li><li>Competitors had similar products. Amazon's strength is that it holds shopping and ad signals together.</li></ul>
<h2>Themes in how it has grown</h2>
<ol><li><b>More access:</b> from invited beta users, to DSP advertisers, to Sponsored Ads advertisers.</li><li><b>Easier use:</b> no-code templates beside raw SQL.</li><li><b>More data:</b> longer retail history for measurement.</li><li><b>More flexible setups:</b> versions that work with a company's own AWS account.</li></ol>
<h2>What to say in the interview</h2>
<p>"AMC was launched by Amazon Ads as a clean room, around 2019 by Amazon's own account, with a wider beta in 2021. Since then it has opened to more advertisers, added templates for non-SQL users, and added longer lookback and AWS integration."</p>
${srcList(['amcsp','adx','aws','look','ppc'])}
`},

{id:'amcuse5',g:'AMC technical',t:'AMC deep dive 3: top 5 business use cases',html:`
<p class="lead">These five cover most of what advertisers do with AMC. For each, learn the business problem, how AMC solves it, and what a support engineer might be asked.</p>
<div class="card"><h3>1. Custom attribution and campaign measurement</h3>
<p><b>Business problem:</b> Standard reports often credit the last click only, so brands cannot see what really drove a purchase.</p>
<p><b>How AMC solves it:</b> Analysts write queries over event-level data and apply their own attribution logic, for example first touch, equal weight, or position-based, with their own lookback windows.</p>
<p><b>Action it triggers:</b> Budget moves to the touchpoints that really contribute, not only the last one.</p>
<p><b>Support angle:</b> "My AMC sales do not match the console." The usual answer is different definitions: window, model, time basis, time zone.</p></div>
<div class="card"><h3>2. Path to conversion and full-funnel journey</h3>
<p><b>Business problem:</b> Brands run awareness and shopping ads, but cannot see how upper-funnel exposure leads to lower-funnel purchase.</p>
<p><b>How AMC solves it:</b> Path-to-conversion queries show the sequence of ads a customer saw before buying, and how long it took.</p>
<p><b>Action it triggers:</b> Better mix and timing across video, display and shopping ads.</p>
<p><b>Support angle:</b> Queries that join several event tables, with duplicate or fan-out problems.</p></div>
<div class="card"><h3>3. Audience overlap, reach and frequency</h3>
<p><b>Business problem:</b> Several campaigns may target the same shoppers, so the brand pays more than once for the same people, or over-shows ads.</p>
<p><b>How AMC solves it:</b> Overlap queries count users reached by one channel, the other, or both, and compare conversion rates across the groups. Frequency analysis shows where extra impressions stop helping.</p>
<p><b>Action it triggers:</b> Spend moves to new, more incremental audiences, and frequency caps are set smartly.</p>
<p><b>Support angle:</b> Small groups missing from results because of aggregation thresholds.</p></div>
<div class="card"><h3>4. New-to-brand and customer insights</h3>
<p><b>Business problem:</b> Growth needs new customers, not only repeat buyers who would buy anyway.</p>
<p><b>How AMC solves it:</b> Analysts find which ads and sequences came before a first purchase, how new and repeat buyers differ, and, with the longer retail history for measurement, how customers behave over time.</p>
<p><b>Action it triggers:</b> Campaigns are judged by new customers won, not by clicks alone.</p>
<p><b>Support angle:</b> Lookback windows and time frame questions.</p></div>
<div class="card"><h3>5. Custom audiences and first-party data collaboration</h3>
<p><b>Business problem:</b> Standard targeting options cannot express the exact group a brand wants, and its own customer data sits outside Amazon.</p>
<p><b>How AMC solves it:</b> Queries define audiences, for example shoppers who watched a video ad but did not buy. These can be activated in Amazon DSP without the advertiser seeing who is in them. The advertiser can also upload hashed first-party data and study overlap with Amazon shoppers, without raw data being exposed.</p>
<p><b>Action it triggers:</b> Precise retargeting and acquisition audiences, and better knowledge of cross-channel customers.</p>
<p><b>Support angle:</b> "My audience will not run" (size or thresholds), and first-party upload and match-rate problems.</p></div>
<h2>A job-description link</h2>
<p>The job description says AMC supports campaign measurement, audience refinement, and supply optimization. The five cases above map to measurement (1, 2, 4), audience refinement (3, 5) and, more broadly, decisions about where spend goes.</p>
<h2>An illustrative query (overlap)</h2>
${warn(`<p>This example is for learning. Table and column names must be checked against the real AMC schema, and the dialect has restrictions. The idea matters more than the exact words.</p>`)}
<pre><code>-- How many users saw one channel only, and how many saw both?
WITH reach AS (
  SELECT user_id, 'DSP' AS channel FROM dsp_impressions
  UNION ALL
  SELECT user_id, 'SP' AS channel FROM sponsored_ads_traffic
),
per_user AS (
  SELECT user_id, COUNT(DISTINCT channel) AS channels_seen
  FROM reach
  GROUP BY user_id
)
SELECT channels_seen, COUNT(DISTINCT user_id) AS users
FROM per_user
GROUP BY channels_seen</code></pre>
<p>Result: users with 1 channel and users with 2 channels. If a group is very small, AMC may remove that row for privacy.</p>
<h2>Practise explaining</h2>
${det('Give me a business use case for AMC.',`<p>Pick one: "A brand running both DSP and Sponsored Ads suspects it pays twice for the same shoppers. In AMC, an analyst counts users reached by each channel and by both, and compares conversion rates. If overlap is high, the brand moves budget to new audiences."</p>`)}
${det('How can AMC help a brand that wants more new customers?',`<p>New-to-brand analysis shows which ads and ad sequences came before first purchases, and a custom audience can be built to reach people who look like those buyers.</p>`)}
`},

{id:'amchow',g:'AMC technical',t:'AMC deep dive 4: how it functions',html:`
<p class="lead">This topic follows the data from the moment it is created to the moment an analyst gets an answer. Knowing this flow helps you find where a problem started.</p>
<div class="flow"><div><b>1. Signals</b>Amazon Ads events and shopping signals, plus advertiser data</div><div><b>2. Pseudonymize</b>Identifiers replaced, no names or emails</div><div class="mid"><b>3. Instance</b>Advertiser's own AMC environment with tables</div><div><b>4. SQL query</b>Analyst runs a query or template</div><div class="mid"><b>5. Privacy engine</b>Aggregation thresholds, no row-level output</div><div><b>6. Results</b>Aggregated table, download, or audience</div></div>
<h2>The main parts</h2>
${tbl(['Part','What it does'],[['Data sources (tables)','What you can query. Includes Amazon Ads events and any first-party or paid data enabled for the instance. You can list them in the AMC interface or through the API.'],['Instance','A dedicated AMC environment, identified by an instance ID, tied to one or more advertisers.'],['SQL engine','Runs your query. It uses a restricted, Presto/Trino-style dialect. For example, SELECT * is reported to be rejected, so every column must be named.'],['Privacy controls','Built-in aggregation thresholds. Rows describing too few people are removed. Amazon documents thresholds without publishing the exact number. Practitioner guides say you usually need more than about 100 unique users per output row.'],['Outputs','Aggregated results you can view or download, results delivered to a storage location, or audiences.'],['Audiences and activation','Queries can define audiences. Reports say activation is mainly in Amazon DSP. Check current options.'],['Interfaces','The AMC section in the Amazon Ads console (SQL editor, templates), and the Amazon Ads API (instances, workflows, schedules, workflow executions, audiences). Partner tools also build on these.']])}
<h2>Life of one query</h2>
${tbl(['Stage','What happens','What can go wrong'],[['1. Write','Analyst writes SQL, or picks a template and sets parameters.','Wrong table or column, reserved word, unsupported syntax.'],['2. Validate','AMC checks the query before running it.','Syntax and dialect errors appear here.'],['3. Run','The query runs asynchronously. Via the API, a run is reported to take at least around 15 minutes, so do not expect instant results.','Time window too wide, heavy joins, quota limits.'],['4. Privacy filter','Rows below the aggregation threshold are removed before results are returned.','Rows silently missing. The output looks the same as "nobody did this".'],['5. Deliver','Results appear in the interface, can be downloaded, or are sent to a configured storage output.','Output location permissions, empty results.'],['6. Use','Analyst reads the table, or an audience is created and used in DSP.','Audience too small, or fails thresholds.']])}
<h2>Query types</h2>
<ul><li><b>Ad-hoc query:</b> run once, now.</li><li><b>Saved query (workflow):</b> a stored query with parameters, so it can be reused.</li><li><b>Scheduled query:</b> a workflow that runs on a regular cadence, like daily or weekly.</li><li><b>Template:</b> a ready-made, often no-code analysis.</li><li><b>Audience query:</b> a query whose result is an audience.</li></ul>
<h2>The AWS Clean Rooms version</h2>
<p>Amazon announced in July 2024 that advertisers can use AMC through AWS Clean Rooms. They can prepare and match their first-party data inside their own AWS account and connect it to AMC signals without moving the underlying data. Guides say supported formats there include CSV, Parquet and Iceberg files in Amazon S3, with an ID mapping step to connect advertiser identifiers to Amazon Ads signals.</p>
<h2>Why this matters for support</h2>
<ul><li>"Where is the problem?" is easier when you know the stage.</li><li>Silent suppression is the most misunderstood part. Always ask: could this group be too small?</li><li>Data is delayed, so a new event may not appear immediately. Older guides mention a delay of 24 to 48 hours. Check current documentation.</li></ul>
${det('Walk me through what happens when an analyst runs a query.',`<p>The analyst writes SQL or picks a template. AMC validates it, runs it on the instance's data, applies privacy rules such as aggregation thresholds, and returns an aggregated result. If it is an audience query, the result becomes an audience for use in Amazon DSP.</p>`)}
${srcList(['ppc','aws','amcsp'])}
`},

{id:'amcconfig',g:'AMC technical',t:'AMC deep dive 5: configuration in detail',html:`
<p class="lead">This is the detailed configuration topic. It covers getting access, instances, accounts and API headers, onboarding first-party data, queries and schedules, audiences, and the privacy settings you cannot change.</p>
${warn(`<p>Setup details change as AMC changes. Several points here come from third-party guides, and the API details come from reference pages copied by other sites. Treat this as a working map, and confirm every step in the current official AMC documentation before telling a customer.</p>`)}
<h2>Step 1: Access and eligibility</h2>
<ul><li>Earlier, advertisers had to register with Amazon Ads or use partner tools to get access.</li><li>Older guides say an account manager sets up the account, and the instance is created in about 3 to 5 business days.</li><li>Newer reports say advertisers who buy Sponsored Ads can use AMC through the Amazon Ads console, with templates.</li><li>The API has instance management calls (create, list, update, delete). Who may use them depends on the account type and approval. Do not assume an advertiser can create instances themselves.</li></ul>
<h2>Step 2: Accounts, instances and identifiers</h2>
${tbl(['Item','What it is','Where it appears'],[['AMC instance ID','Identifies one AMC environment','In API paths and audience headers'],['AMC account (entity) ID','Identifies the account that owns the instance','Fetched with an accounts call, used in headers'],['Advertiser ID','Identifies an advertiser inside the instance','API header'],['Marketplace ID','Identifies the country marketplace','API header'],['API client ID','Identifies your app in the Amazon Ads API','API header']])}
<p>A very common support cause: the right query but the wrong instance, advertiser or marketplace header. Always check these first.</p>
<h2>Step 3: Users and permissions</h2>
<ul><li>A user needs AMC access for the instance.</li><li>Some operations need extra permission. For example, reading query-based audiences needs a specific permission on that instance.</li><li>If a person gets an authorisation error (401 or 403), check the user, the role, the token, and that the instance matches.</li></ul>
<h2>Step 4: Know your data sources</h2>
<ul><li>List the available tables (data sources) in the AMC interface or API. Each shows columns, owner, provider and the ad product it relates to.</li><li>Some tables come from paid or optional features. A table that is missing or empty may simply not be enabled for that instance.</li><li>Data windows have changed over time. Older guides mention 28 days at start and up to about 12.5 months of data. Retail purchase history for measurement can now go back up to five years. Always confirm current limits.</li></ul>
<h2>Step 5: Onboard first-party data</h2>
<p>This is where many support tickets start. In the API-based flow described in partner documentation:</p>
<ol><li>Prepare files in a supported format (CSV and GZIP are supported).</li><li>Choose the dataset type (see the table below).</li><li>Normalise identifiers, then hash them with SHA-256 before upload. Raw email, phone or address is not accepted.</li><li>Create an S3 bucket for the files. It should be a new bucket that is not tied to the AMC instance.</li><li>Give AMC read access to the bucket, using the 12-digit AWS account ID used for data upload.</li><li>Encrypt the data as required, and upload files in the right partition (time period).</li><li>Check that the dataset appears in the instance, then query it.</li></ol>
${tbl(['Dataset type','Use','Refresh','Needs timestamp and partition','Hashed ID columns'],[['Fact','Time series data, like purchases over time','Incremental','Yes (period can be minute, hour, day or week)','Supported'],['Dimension','Static tables, like a product or customer list','Full refresh','No','Supported']])}
<h3>Hashing rules</h3>
${tbl(['Data','Prepare before hashing'],[['Email','Remove spaces, make lowercase'],['Phone','International E.164 format'],['Address','Split into separate fields (street, city, state, postal code)'],['Any list','Remove duplicates and bad rows first']])}
<p>Mistakes here do not always give an error. They often just lower the match rate quietly, which later looks like "my audience is too small".</p>
<p>Here is a simple hashing example in Python (from the Python basics topics):</p>
<pre><code>import hashlib

def hash_email(email):
    cleaned = email.strip().lower()
    return hashlib.sha256(cleaned.encode("utf-8")).hexdigest()

print(hash_email("  Test@Example.com "))</code></pre>
<p>Output:</p>
<pre><code>973dfe463ec85785f5f95af5ba3906eedb2d931c24e69824a89ea65dba4e813b</code></pre>
<p>The same hash from the shell (the <code>-n</code> avoids adding a new line, which would change the hash):</p>
<pre><code>echo -n "test@example.com" | sha256sum</code></pre>
<h2>Step 6: Queries, workflows and schedules</h2>
<ul><li><b>Workflow:</b> a saved query with an ID. Its definition has the SQL, input parameters, and output columns and format.</li><li><b>Ad-hoc execution:</b> a one-time run. A published API reference mentions a quota of about 30 ad-hoc runs per day per instance. Confirm this in the official reference.</li><li><b>Schedule:</b> runs a workflow on a cadence such as daily or weekly.</li><li><b>Parameters:</b> a workflow cannot use a parameter that is not defined, and compilation fails.</li><li><b>Outputs:</b> results can be shown or downloaded, or delivered to a storage location you configure.</li></ul>
<p>Illustrative API call (shape only, check the official reference):</p>
<pre><code>POST https://advertising-api.amazon.com/amc/reporting/{instanceId}/workflowExecutions
Headers:
  Amazon-Advertising-API-ClientId: your client id
  Amazon-Advertising-API-AdvertiserId: account id
  Amazon-Advertising-API-MarketplaceId: marketplace id
Body (shape):
  workflow: { workflowId, sqlQuery, inputParameters, outputColumns }</code></pre>
<h2>Step 7: Audiences</h2>
<ul><li>Audiences are created from a query (rule-based or query-based), or as lookalike audiences.</li><li>Metadata about audience runs can be listed through the API, with permission.</li><li>An audience may not run because of aggregation thresholds, low audience size, or query errors.</li><li>Activation is mainly in Amazon DSP according to reports.</li></ul>
<h2>Step 8: Privacy settings (you cannot change these)</h2>
<ul><li>Aggregation thresholds are built in. Rows with too few users are removed, and the removal is silent.</li><li>Row-level output is blocked, and raw identifiers cannot be uploaded.</li><li>Data and features follow privacy rules per marketplace.</li></ul>
<h2>Costs to be aware of</h2>
<p>One guide says costs can stack across instance usage, AWS storage, data transfer, query work, and partner support, and that Amazon does not publish a single price sheet for every setup. Do not quote prices to customers. Send them to their account team.</p>
<h2>Setup checklist</h2>
<label class="chk"><input type="checkbox" data-keep="cf1"> I know who sets up the instance and how access is requested.</label>
<label class="chk"><input type="checkbox" data-keep="cf2"> I know instance ID, account ID, advertiser ID and marketplace ID, and where each is used.</label>
<label class="chk"><input type="checkbox" data-keep="cf3"> I can list data sources and check paid or optional ones.</label>
<label class="chk"><input type="checkbox" data-keep="cf4"> I can explain fact vs dimension datasets.</label>
<label class="chk"><input type="checkbox" data-keep="cf5"> I know the hashing rules: normalise first, SHA-256, never raw data.</label>
<label class="chk"><input type="checkbox" data-keep="cf6"> I can explain workflows, schedules and parameters.</label>
<label class="chk"><input type="checkbox" data-keep="cf7"> I know why audiences may fail to run.</label>
<label class="chk"><input type="checkbox" data-keep="cf8"> I understand aggregation thresholds and silent suppression.</label>
<h2>Common configuration problems, and first checks</h2>
${tbl(['Customer says','First checks'],[['Upload failed','Is the data hashed with SHA-256? Is the file format and dataset type right? Does AMC have read access to the bucket? Is the timestamp or partition correct for a fact dataset?'],['Match rate is very low','Normalisation of emails, phones and addresses, duplicates in the list, wrong identifier column.'],['I get 401 or 403 from the API','Token, user permission, client ID, instance and advertiser headers.'],['The table is missing or empty','Is the feature enabled for this instance? Date coverage? Right instance?'],['My scheduled query did not run','Workflow definition valid? Parameters defined? Schedule active? Previous run errors?'],['My audience will not run','Audience size, aggregation thresholds, errors in the audience query.'],['Results are missing groups','Aggregation threshold, filters, INNER JOIN.']])}
${srcList(['lr','ppc','aws','look'])}
`},

{id:'amchelp',g:'AMC technical',t:'AMC deep dive 6: how it helps',html:`
<p class="lead">This topic is about value: what AMC changes for a business, where it falls short, and what that means for your role.</p>
<h2>Before and after AMC</h2>
${tbl(['Without AMC','With AMC'],[['Each ad type reports its own sales, so the brand may count the same sale twice.','One event-level view across channels shows who saw what, and in which order.'],['Last-click credit favours the final ad.','Custom attribution shows how earlier ads contribute.'],['The brand cannot see how many shoppers it pays to reach twice.','Overlap and frequency queries show waste and saturation.'],['Audiences are limited to preset options.','Audiences are built from the brand\'s own logic and data.'],['First-party data stays separate from Amazon data.','First-party data can be matched with Amazon signals in a privacy-safe way.']])}
<h2>Main benefits</h2>
<ol><li><b>Better budget decisions:</b> spend follows real contribution.</li><li><b>Less wasted spend:</b> overlap and over-frequency are found.</li><li><b>More new customers:</b> campaigns are judged on new-to-brand results.</li><li><b>Sharper audiences:</b> more precise groups for targeting.</li><li><b>Privacy-safe collaboration:</b> brand data is used without exposing individuals.</li><li><b>Flexible questions:</b> analysts answer their own questions instead of waiting for a fixed report.</li></ol>
<h2>An illustrative example (not real data)</h2>
<div class="card"><p>A brand runs Amazon DSP video and Sponsored Products. Standard reports show each ad type taking credit for sales. In AMC, an analyst runs an overlap analysis and finds that most buyers saw both ad types, and that shoppers who saw video first converted more often. The brand moves some budget from repeated retargeting to prospecting audiences and sets a frequency limit. Result: the same budget reaches more new shoppers. This is a made-up example to explain the idea. Real results differ.</p></div>
<h2>Honest limits</h2>
<ul><li><b>Needs SQL skills</b> for custom analysis, though templates help.</li><li><b>Not real time.</b> Data has a delay.</li><li><b>Small groups are hidden.</b> Thresholds can remove rows silently.</li><li><b>Dialect restrictions</b> make normal SQL fail in surprising ways.</li><li><b>Costs and availability</b> vary by setup and marketplace.</li><li><b>Analysis is not action.</b> Value only comes when results change decisions.</li></ul>
<h2>What this means for a support engineer</h2>
<p>Analysts depend on AMC to make business decisions. When their query fails, results look wrong, or an audience does not run, a campaign decision waits. Your job is to unblock them quickly and clearly.</p>
${tbl(['Typical ticket','Why it happens'],[['Query fails','Dialect, reserved word, unsupported syntax, time window'],['Empty or small result','Date range, filters, joins, aggregation threshold'],['Numbers differ from console','Different attribution, window, time basis or time zone'],['Audience will not run','Audience size or thresholds'],['First-party upload or match problems','Hashing, normalisation, permissions, format'],['API errors','Headers, token, permission, quota'],['Schedule did not run','Workflow, parameters, previous run errors']])}
<h2>Your growth angle for the interview</h2>
<p>Your background in audience segmentation, SQL debugging, Splunk log tracing and API support at GlobalLogic, and your PX integration ownership at Gainsight, map well to these tickets. Say so with a real example.</p>
`},

{id:'amcqa',g:'AMC technical',t:'AMC interview questions and answers',html:`
<p class="lead">Practise saying these answers aloud in your own words. Keep each one to about 30 to 60 seconds.</p>
${det('What is Amazon Marketing Cloud?',`<p>A secure, privacy-safe clean room from Amazon Ads. Advertisers use SQL to analyse pseudonymized Amazon Ads events and shopping signals together with their own data. Results come back as aggregated insights, never individual-level data, and are used for measurement and audiences.</p>`)}
${det('What is a clean room, in simple words?',`<p>A secure shared space where two parties can analyse combined data without seeing each other's raw records. You can ask questions and get aggregated answers, but you cannot take out lists of people.</p>`)}
${det('When was AMC launched?',`<p>Amazon says 2019. There was a wider beta in early 2021, and it moved out of beta in late 2021 with Amazon DSP integration. Since then it has added AWS Clean Rooms support in 2024, a five-year retail lookback for measurement in 2025, and access for sponsored ads advertisers.</p>`)}
${det('Give me three business use cases.',`<p>Custom attribution and measurement beyond last click. Overlap, reach and frequency analysis to reduce wasted spend. Custom audiences from the brand's own logic, activated in Amazon DSP. (Also: path to conversion, new-to-brand analysis, and first-party data collaboration.)</p>`)}
${det('How is AMC different from the standard Amazon Ads console?',`<p>The console shows fixed reports. AMC gives event-level data in SQL, so analysts can define their own attribution, study journeys and overlap, and create audiences.</p>`)}
${det('Why might a query return no rows or missing rows?',`<p>Filters or date range exclude the data, a join does not match, a table is not enabled for the instance, or aggregation thresholds remove small groups. I would test each table alone with a simple count, then add parts back.</p>`)}
${det('A customer says AMC sales do not match the console. What do you do?',`<p>Compare definitions first: attribution window and model, time basis (ad traffic time or conversion time), time zone, and deduplication. Align the query to the console logic and show the difference. Escalate as a defect only if numbers still differ after aligning definitions.</p>`)}
${det('How does first-party data get into AMC?',`<p>The advertiser prepares files, normalises and hashes identifiers with SHA-256, uploads them through an approved route such as a storage bucket with the right permissions, and the data becomes a dataset in the instance. Raw identifiers are not accepted.</p>`)}
${det('What are aggregation thresholds and why do they confuse people?',`<p>AMC removes result rows that describe too few users, to protect privacy. The removal is silent, so a missing row looks the same as a row where nothing happened. I always ask whether the group might be too small.</p>`)}
${det('How would you explain AMC to a non-technical marketer?',`<p>"It is a safe room where you can ask detailed questions about how your ads and your own customer data work together. You get answers like which ad combinations lead to purchases, without anyone seeing individual customers."</p>`)}
${det('How would you help an analyst whose audience will not run?',`<p>Check audience size and thresholds, check the audience query for errors, check permissions on the instance, and check whether first-party matching is low because of hashing or normalisation. Then explain the cause in simple words and suggest a broader definition.</p>`)}
${det('Why do you think AMC is a good fit for your background?',`<p>Use your own experience: debugging SQL audience queries, tracing issues through logs, supporting API integrations, working with engineering on root cause, and building tools. Then say you want to apply this to advertising data at larger scale.</p>`)}
<h2>Questions to ask the team about AMC</h2>
<ul><li>Which AMC features generate the most support cases today?</li><li>How is the team helping non-SQL users with templates?</li><li>What tools does the support team use to reproduce customer queries?</li><li>How do you handle changes in the product, such as new data sources?</li></ul>
`},

{id:'amcsql',g:'AMC technical',t:'AMC SQL rules and cheat sheet',html:`
<p class="lead">Analysts who know normal SQL still get stuck in AMC because of dialect and privacy rules. This is where support engineers add value.</p>
${warn(`<p>The points below come from third-party AMC guides, not official documents. Verify each one in the AMC documentation before you state it as a fact in an interview. A safe way to say it: "As per my understanding, and I would confirm in the docs..."</p>`)}
<h2>Reported AMC behaviours</h2>
<div class="tablewrap"><table><tr><th>Topic</th><th>What guides report</th></tr>
<tr><td>Dialect</td><td>Based on a Presto/Trino-style SQL, with extra restrictions.</td></tr>
<tr><td>ORDER BY</td><td>Reported as not supported for the final result. Sorting is done after downloading or in the UI.</td></tr>
<tr><td>Reserved words</td><td>Words like "month" and "at" cannot be used as column names.</td></tr>
<tr><td>SELECT * and RIGHT JOIN</td><td>Reported restrictions. Select named columns and prefer LEFT JOIN.</td></tr>
<tr><td>Long time windows</td><td>A hint comment, EXTEND_TIME_WINDOW, is reported to extend the window.</td></tr>
<tr><td>Tables</td><td>Examples named in guides: sponsored_ads_traffic, dsp_impressions, amazon_attributed_events_by_traffic_time. Some tables need paid features.</td></tr>
<tr><td>Privacy</td><td>Results are aggregated. Small groups may be filtered. Confirm threshold details in the docs.</td></tr></table></div>
<p>The ORDER BY point most likely applies to the final query result. ORDER BY inside a window function\'s OVER clause is part of window syntax. Confirm in the docs.</p>
<h2>Cheat sheet: SQLite (this workbook) to Presto/Trino-style</h2>
<div class="tablewrap"><table><tr><th>Task</th><th>Practice console (SQLite)</th><th>AMC-style (verify)</th></tr>
<tr><td>Days between two times</td><td>julianday(b) - julianday(a)</td><td>date_diff('day', a, b)</td></tr>
<tr><td>Date part of a timestamp</td><td>date(ts)</td><td>CAST(ts AS date) or date(ts)</td></tr>
<tr><td>Add 7 days</td><td>date(ts, '+7 day')</td><td>date_add('day', 7, ts)</td></tr>
<tr><td>Start of week or month</td><td>strftime(...)</td><td>date_trunc('week', ts)</td></tr>
<tr><td>Quick unique count on big data</td><td>COUNT(DISTINCT x)</td><td>COUNT(DISTINCT x), or approx_distinct(x)</td></tr></table></div>
<h2>How to talk about this in the interview</h2>
