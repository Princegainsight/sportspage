<p>If you are asked "How would you debug a query failing only in AMC?", say: "I would read the exact error, check it against AMC supported syntax and reserved words, cut the query down until it runs, then add parts back one by one. Once I find the cause, I give the customer the working query and add a note to the documentation."</p>`},

{id:'sqlb1',g:'SQL from zero',sql:1,t:'SQL basics 1: what is a database?',html:`
<p class="lead">Start here if SQL feels new. We go slowly, from the very first idea, and no topic is skipped. Run every small example in the boxes.</p>
<div id="engineBox"></div>
<h2>What is a database?</h2>
<p>A database is a place where data is stored in an organised way. Think of an Excel file:</p>
<ul><li>The whole Excel file is like the <b>database</b>.</li><li>Each sheet inside is like a <b>table</b>.</li><li>Each line in a sheet is a <b>row</b>. It is one record, for example one click.</li><li>Each heading is a <b>column</b>. It is one detail, for example the time of the click.</li></ul>
<h2>What is SQL?</h2>
<p>SQL (say "S-Q-L" or "sequel") is the language used to ask questions to a database. You write a short instruction called a <b>query</b>, and the database replies with a table of results.</p>
<p>In plain English: "Show me the name and channel of all campaigns." In SQL it becomes:</p>
<pre><code>SELECT name, channel FROM campaigns;</code></pre>
<p>Amazon Marketing Cloud analysts also write SQL queries like this to study advertising data. So SQL is the main skill for this role.</p>
<h2>Our practice tables</h2>
<p>This is how the campaigns table looks. It has 4 rows and 3 columns.</p>
${tbl(['campaign_id','name','channel'],[['1','Diwali Sale','DSP'],['2','Back to School','DSP'],['3','Brand Keywords','Sponsored Ads'],['4','Prime Day Teaser','Sponsored Ads']])}
<p>The practice data has five tables:</p>
${tbl(['Table','What one row means'],[['campaigns','One advertising campaign'],['users','One person'],['impressions','One time an ad was shown to a person'],['clicks','One time a person clicked an ad'],['conversions','One purchase after an ad, with the revenue']])}
<h2>Words you must know</h2>
${tbl(['Word','Meaning','Example'],[['Row (record)','One line of a table','One click'],['Column (field)','One detail about each row','click_time'],['Primary key','A column whose value is different in every row. It identifies the row.','campaign_id in campaigns'],['Foreign key','A column that points to the primary key of another table. This connects tables.','campaign_id in impressions'],['NULL','No value, or unknown. It is not zero and not empty text.','A user with no click has NULL in the click columns after a LEFT JOIN'],['Query','One SQL instruction that asks a question','SELECT * FROM users']])}
<h2>Data types</h2>
<ul><li><b>Numbers:</b> 5, 2700, 3.14. You can add and average them.</li><li><b>Text:</b> 'Delhi'. Always in single quotes in SQL.</li><li><b>Dates and times:</b> '2026-10-05 14:30:00'. In our practice tables they are stored as text in this format: year-month-day hour:minute:second.</li></ul>
<h2>Two kinds of SQL work</h2>
<ul><li><b>Reading data</b> with SELECT. This is 95 percent of your work in support.</li><li><b>Changing data</b> with INSERT, UPDATE, DELETE. This practice console does not allow it, so you cannot break anything.</li></ul>
<h2>Writing rules</h2>
<ul><li>SQL words like SELECT and FROM are not case sensitive. <code>select</code> works too, but capitals are easier to read.</li><li>Spaces and new lines do not matter. Use new lines to keep queries readable.</li><li>A semicolon <code>;</code> at the end is good practice.</li><li>Comments start with two dashes: <code>-- this is a note</code>.</li></ul>
<h2>Try it</h2>
${ex('BT1')}
<p>Change <code>campaigns</code> to <code>users</code>, then <code>clicks</code>, and run each. You are looking at the tables.</p>
<h2>Quick check</h2>
${det('What is a row and what is a column?',`<p>A row is one record (one click, one user). A column is one detail that every row has (like city).</p>`)}
${det('What is the difference between a primary key and a foreign key?',`<p>A primary key is unique in its own table, like campaign_id in campaigns. A foreign key is the same kind of value sitting in another table to connect them, like campaign_id in impressions.</p>`)}
${det('Is NULL the same as 0?',`<p>No. 0 is a number. NULL means there is no value at all. This difference causes many wrong results, so remember it.</p>`)}
`},

{id:'sqlb2',g:'SQL from zero',sql:1,t:'SQL basics 2: SELECT',html:`
<p class="lead">SELECT is the heart of SQL. Every query you write starts with it.</p>
<div id="engineBox"></div>
<h2>The basic pattern</h2>
<pre><code>SELECT   what you want to see
FROM     which table;</code></pre>
<ul><li><code>SELECT *</code> means all columns.</li><li><code>SELECT name, channel</code> means only these two columns. Put a comma between columns.</li><li><code>LIMIT 5</code> at the end means only the first 5 rows.</li></ul>
<h2>Renaming a column with AS</h2>
<p>An alias is a nickname for a column in the result. It does not change the table.</p>
${ex('BT2')}
<h2>Sorting with ORDER BY</h2>
<p><code>ORDER BY revenue DESC</code> puts the highest first. <code>ASC</code> is the opposite and is the default. ORDER BY is always near the end of the query.</p>
${ex('BT3')}
<h2>Removing repeats with DISTINCT</h2>
<p>If a value is repeated in many rows, DISTINCT shows each value once.</p>
${ex('BT4')}
<h2>How to read an error message</h2>
<p>Errors are normal. Read them calmly, the message tells you what to fix. These are SQLite messages. AMC will word them differently, but the habit is the same.</p>
${tbl(['Message looks like','Usually means'],[['no such column: nam','You made a spelling mistake in a column name.'],['no such table: campaign','The table name is wrong. Check the spelling and the plural.'],['near "FROM": syntax error','Often an extra comma just before FROM.'],['near "channel": syntax error','Often a missing comma between two columns.']])}
<h2>Practice</h2>
${ex('A1')}${ex('A2')}${ex('A3')}
${note(`<p>Remember: SELECT chooses columns. Later we will use WHERE to choose rows.</p>`)}
`},

{id:'sqlb3',g:'SQL from zero',sql:1,t:'SQL basics 3: WHERE (filtering rows)',html:`
<p class="lead">SELECT chooses columns. WHERE chooses rows. Together they answer most simple questions.</p>
<div id="engineBox"></div>
<h2>The pattern</h2>
<pre><code>SELECT columns
FROM   table
WHERE  condition;</code></pre>
<p>Only the rows where the condition is true are kept.</p>
${ex('BT5')}
<h2>Comparison signs</h2>
${tbl(['Sign','Meaning','Example'],[['=','equal to',"city = 'Pune'"],['&lt;&gt; or !=','not equal to',"device &lt;&gt; 'mobile'"],['&gt;  &lt;','greater, smaller','revenue &gt; 3000'],['&gt;=  &lt;=','greater or equal, smaller or equal','revenue &gt;= 2000']])}
<p>Remember: text goes in single quotes, numbers do not.</p>
<h2>Joining conditions: AND, OR, NOT</h2>
<ul><li><b>AND:</b> both conditions must be true.</li><li><b>OR:</b> at least one must be true.</li><li><b>NOT:</b> reverses a condition.</li><li>AND is checked before OR. When you mix them, <b>use brackets</b> so your meaning is clear.</li></ul>
${ex('BT6')}
<h2>More useful tools</h2>
${tbl(['Tool','Meaning','Example'],[['IN','matches any value in a list',"city IN ('Pune', 'Delhi')"],['BETWEEN','from one value to another, both included','revenue BETWEEN 1000 AND 3000'],['LIKE','matches a text pattern. % means anything.',"name LIKE 'B%'"],['IS NULL','checks for no value','click_id IS NULL']])}
${ex('BT7')}
<h2>Careful with dates</h2>
<p>A time like <code>2026-10-05 14:30:00</code> is not equal to <code>'2026-10-05'</code>. Use <code>date(column)</code> to take only the date part. (In AMC the date function may be different. See the AMC SQL topic.)</p>
<h2>NULL needs special words</h2>
<p>Never write <code>= NULL</code>. It never matches. Always write <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>
<h2>Practice</h2>
${ex('A4')}${ex('A5')}${ex('A6')}${ex('A7')}${ex('A8')}
`},

{id:'sqlb4',g:'SQL from zero',sql:1,t:'SQL basics 4: counting and GROUP BY',html:`
<p class="lead">Now we move from looking at rows to getting answers: how many, how much, what average. This is where SQL becomes powerful.</p>
<div id="engineBox"></div>
<h2>Aggregate functions</h2>
<p>An aggregate function takes many rows and gives one answer.</p>
${tbl(['Function','Gives','Example'],[['COUNT(*)','number of rows','How many users?'],['COUNT(column)','number of rows where the column is not NULL','How many clicks have a time?'],['COUNT(DISTINCT column)','number of different values','How many different people?'],['SUM(column)','total','Total revenue'],['AVG(column)','average','Average revenue'],['MIN, MAX','smallest, biggest','Earliest time']])}
${ex('BT8')}
<h2>GROUP BY: one answer for each group</h2>
<p>Imagine a class of students. You ask "How many students are in each section?" You first put students in groups by section, then count each group. That is GROUP BY.</p>
<p>Example: the rows of users are grouped by device, and each group is counted.</p>
${tbl(['device','users_count'],[['desktop','16'],['mobile','11'],['tablet','13']])}
${ex('BT9')}
<h2>The golden rule</h2>
<p>Every column in SELECT must be either inside GROUP BY or inside an aggregate function. If not, the query is wrong.</p>
<pre><code>SELECT city, COUNT(*)     -- city is in GROUP BY, COUNT is an aggregate. Good.
FROM users
GROUP BY city;</code></pre>
<h2>HAVING: filtering the groups</h2>
<p>WHERE filters rows before grouping. HAVING filters groups after grouping, so you can use counts in it.</p>
<pre><code>SELECT user_id, COUNT(*)
FROM impressions
GROUP BY user_id
HAVING COUNT(*) &gt;= 4;</code></pre>
<h2>The order SQL runs in</h2>
<p>Memorise: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. This explains why WHERE cannot use COUNT, and HAVING can.</p>
<h2>Practice</h2>
${ex('A9')}${ex('A10')}${ex('A11')}${ex('A12')}${ex('A13')}
`},

{id:'sqlb5',g:'SQL from zero',sql:1,t:'SQL basics 5: JOIN from zero',html:`
<p class="lead">Joins connect tables. They are the most important idea in SQL, and the reason behind most wrong numbers in real cases. We start with why.</p>
<div id="engineBox"></div>
<h2>Why are data split into many tables?</h2>
<p>Look at your phone contacts. You save a person's name once, not in every call record. Databases do the same. The campaign name is saved once in campaigns, and other tables store only campaign_id. To see the name next to a conversion, you must <b>join</b> the tables.</p>
<h2>A tiny example</h2>
<p><b>campaigns</b></p>
${tbl(['campaign_id','name'],[['1','Diwali Sale'],['2','Back to School'],['4','Prime Day Teaser']])}
<p><b>conversions</b></p>
${tbl(['conv_id','campaign_id','revenue'],[['10','1','4000'],['11','1','500'],['12','2','2700']])}
<p>The shared column <code>campaign_id</code> connects them.</p>
<h2>INNER JOIN: only the matches</h2>
<pre><code>SELECT c.name, v.revenue
FROM conversions v
JOIN campaigns c ON c.campaign_id = v.campaign_id;</code></pre>
${tbl(['name','revenue'],[['Diwali Sale','4000'],['Diwali Sale','500'],['Back to School','2700']])}
<p>Prime Day Teaser has no conversion, so it is missing from the result.</p>
<h2>LEFT JOIN: keep everything from the left table</h2>
<pre><code>SELECT c.name, v.revenue
FROM campaigns c
LEFT JOIN conversions v ON v.campaign_id = c.campaign_id;</code></pre>
${tbl(['name','revenue'],[['Diwali Sale','4000'],['Diwali Sale','500'],['Back to School','2700'],['Prime Day Teaser','<i>NULL</i>']])}
<p>Now Prime Day Teaser appears, with NULL where no match exists. This is how you find "missing" things.</p>
<h2>How to write a join, step by step</h2>
<ol><li>Write the question in plain English.</li><li>Decide which tables hold the data.</li><li>Find the matching column (the key).</li><li>Write <code>FROM A JOIN B ON A.key = B.key</code>. Use short nicknames like c and v.</li><li>Add WHERE, GROUP BY, as needed.</li><li>Check: does the number of rows look reasonable?</li></ol>
${ex('BT10')}${ex('BT11')}
${warn(`<p><b>Danger: fan-out.</b> If you join two tables that both have many rows for the same key, rows multiply and totals become wrong. You will practise this in SQL lesson 2. For now, always check the row count after a join.</p>`)}
<h2>Practice</h2>
${ex('A14')}${ex('A15')}${ex('A16')}
${note(`<p>Well done. You have now covered the full basics. Continue with SQL lessons 1 to 4 for CTEs, CASE, window functions and debugging.</p>`)}
`},

{id:'sqlmost',g:'SQL from zero',t:'Most used SQL in support work',html:`
<p class="lead">If you remember only one page, make it this one. These are the patterns that appear again and again when helping analysts. Read the template, then say in your own words what it does.</p>
${tbl(['Need','Template'],[
['Look at a table','<code>SELECT * FROM t LIMIT 10;</code>'],
['Filter rows','<code>WHERE col = \'x\' AND col2 &gt; 5</code>'],
['Count rows','<code>SELECT COUNT(*) FROM t;</code>'],
['Count unique people','<code>SELECT COUNT(DISTINCT user_id) FROM t;</code>'],
['Count per group','<code>SELECT g, COUNT(*) FROM t GROUP BY g;</code>'],
['Only big groups','<code>... GROUP BY g HAVING COUNT(*) &gt; 10</code>'],
['Top 5','<code>... ORDER BY n DESC LIMIT 5</code>'],
['Join two tables','<code>FROM a JOIN b ON b.k = a.k</code>'],
['Find missing rows','<code>FROM a LEFT JOIN b ON b.k = a.k WHERE b.k IS NULL</code>'],
['Find duplicates','<code>GROUP BY id HAVING COUNT(*) &gt; 1</code>'],
['First row per group','<code>ROW_NUMBER() OVER (PARTITION BY g ORDER BY t)</code> then keep rn = 1'],
['If-else','<code>CASE WHEN x &gt; 10 THEN \'High\' ELSE \'Low\' END</code>'],
['Name a step','<code>WITH step AS (SELECT ...) SELECT * FROM step</code>'],
['Previous row value','<code>LAG(col) OVER (PARTITION BY g ORDER BY t)</code>'],
['Rate or percent','<code>1.0 * part / total</code> (the 1.0 gives decimals)']])}
<h2>Ten sentences to explain SQL aloud</h2>
<ol><li>A table has rows and columns.</li><li>SELECT chooses columns, WHERE chooses rows.</li><li>GROUP BY makes groups, and aggregates like COUNT and SUM give one answer per group.</li><li>HAVING filters groups, WHERE filters rows.</li><li>A JOIN connects two tables with a shared key.</li><li>INNER JOIN keeps only matches, LEFT JOIN keeps all rows from the left table.</li><li>NULL means no value, so use IS NULL.</li><li>A CTE gives a name to a step so the query reads top to bottom.</li><li>A window function calculates across related rows without collapsing them.</li><li>Most wrong numbers come from fan-out, duplicates, or the wrong level of detail.</li></ol>
`},

{id:'sql0',g:'SQL practice',sql:1,t:'SQL setup: practice data',html:`
<p class="lead">Everything runs inside this page. We have a small ad-tech dataset. Learn its shape first, because every SQL lesson uses it.</p>
<div id="engineBox"></div>
<div class="tablewrap"><table><tr><th>Table</th><th>Columns</th><th>Meaning</th></tr>
<tr><td>campaigns</td><td>campaign_id, name, channel</td><td>4 campaigns. Channel is DSP or Sponsored Ads.</td></tr>
<tr><td>users</td><td>user_id, city, device</td><td>40 users.</td></tr>
<tr><td>impressions</td><td>imp_id, user_id, campaign_id, imp_time</td><td>Each time an ad was shown. A few duplicate rows are hidden inside on purpose.</td></tr>
<tr><td>clicks</td><td>click_id, user_id, campaign_id, click_time</td><td>Each time an ad was clicked.</td></tr>
<tr><td>conversions</td><td>conv_id, user_id, campaign_id, conv_time, revenue</td><td>Purchases. Campaign 4 has none.</td></tr></table></div>
<p>Times are text like <code>2026-10-05 14:30:00</code>. This console uses SQLite, which is a different dialect from AMC. The core ideas are the same. Use the cheat sheet in the AMC SQL topic to translate.</p>
<h2>Free console</h2>
${ex('FREE')}
<p>Run <code>SELECT * FROM users</code>, <code>SELECT * FROM clicks LIMIT 10</code>, and so on. Spend 5 minutes just looking at the data.</p>`},

{id:'sql1',g:'SQL practice',sql:1,t:'SQL lesson 1: select, filter, group',html:`
<p class="lead">Goal: read and write simple queries confidently. Finish this lesson in about one hour.</p>
<div id="engineBox"></div>
<h2>How SQL really thinks</h2>
<p>You write SELECT first, but SQL runs in this order:</p>
<ol><li><b>FROM</b>: which table</li><li><b>WHERE</b>: which rows to keep</li><li><b>GROUP BY</b>: make groups</li><li><b>HAVING</b>: which groups to keep</li><li><b>SELECT</b>: which columns to show</li><li><b>ORDER BY</b> and <b>LIMIT</b>: sort and cut</li></ol>
<p>Remember this order. It explains WHERE vs HAVING, and many interview questions.</p>
${ex('T1')}
<h2>Common mistakes</h2>
<ul><li>Text values need single quotes: <code>channel = 'DSP'</code>.</li><li><code>COUNT(*)</code> counts rows. <code>COUNT(col)</code> skips NULLs. <code>COUNT(DISTINCT col)</code> counts unique values.</li><li>Every column in SELECT must be in GROUP BY or inside an aggregate like SUM or COUNT.</li></ul>
<h2>Practice</h2>
${ex('E11')}${ex('E12')}${ex('E13')}${ex('E14')}`},

{id:'sql2',g:'SQL practice',sql:1,t:'SQL lesson 2: joins and NULLs',html:`
<p class="lead">Joins cause most wrong numbers in real support cases. Learn them well.</p>
<div id="engineBox"></div>
<h2>Join types in simple words</h2>
<ul><li><b>INNER JOIN:</b> only rows that match on both sides.</li><li><b>LEFT JOIN:</b> all rows from the left table, plus matches from the right. No match gives NULL.</li></ul>
${ex('T2')}
<h2>Fan-out: the number one reason for inflated numbers</h2>
<p>If one user has 3 impressions and 2 clicks, joining both on user gives 3 x 2 = 6 rows. Totals become wrong. Cure: aggregate each side first, then join.</p>
${ex('T2b')}
<h2>NULL rules</h2>
<ul><li>Use <code>IS NULL</code>, never <code>= NULL</code>.</li><li>A WHERE filter on a right-side column after a LEFT JOIN removes the NULL rows. Your LEFT JOIN acts like an INNER JOIN.</li></ul>
<h2>Practice</h2>
${ex('E21')}${ex('E22')}${ex('E23')}${ex('E24')}`},

{id:'sql3',g:'SQL practice',sql:1,t:'SQL lesson 3: CTE, CASE, dates, dedupe',html:`
<p class="lead">These tools turn messy questions into clean steps.</p>
<div id="engineBox"></div>
<h2>CTE with WITH</h2>
<p>A CTE gives a name to a step, so your query reads top to bottom. In support, CTEs are also easy to explain to a customer.</p>
${ex('T3')}
<h2>Also learn</h2>
<ul><li><b>CASE WHEN:</b> if-else inside a query.</li><li><b>COUNT(DISTINCT):</b> unique people.</li><li><b>Dates:</b> a timestamp is not equal to a date. Convert, or use a range.</li><li><b>Dedupe:</b> SELECT DISTINCT, or ROW_NUMBER (next lesson).</li></ul>
<h2>Practice</h2>
${ex('E31')}${ex('E32')}${ex('E33')}${ex('E34')}`},

{id:'sql4',g:'SQL practice',sql:1,t:'SQL lesson 4: window functions',html:`
<p class="lead">Window functions are the favourite "advanced SQL" topic in interviews. They look scary but the idea is simple.</p>
<div id="engineBox"></div>
<h2>The idea</h2>
<p>GROUP BY collapses many rows into one. A window function keeps all rows and adds a calculated column that looks at related rows.</p>
<pre><code>function() OVER (PARTITION BY group_column ORDER BY sort_column)</code></pre>
<ul><li><b>PARTITION BY:</b> the group (like GROUP BY, but rows are kept).</li><li><b>ORDER BY:</b> the order inside each group.</li><li><b>ROW_NUMBER, RANK:</b> numbering and ranking.</li><li><b>LAG, LEAD:</b> value from previous or next row.</li><li><b>SUM() OVER:</b> running totals.</li></ul>
${ex('T4')}
<h2>Practice</h2>
${ex('E41')}${ex('E42')}${ex('E43')}${ex('E44')}
${note(`<p>The pattern in E42 (number rows, keep rn = 1) is the most used trick in real work: first event per user, latest record, and deduplication.</p>`)}`},

{id:'sqldebug',g:'SQL practice',sql:1,t:'Debug wrong results',html:`
<p class="lead">This is your real job: a customer says "the number looks wrong". Learn the usual suspects.</p>
<div id="engineBox"></div>
<h2>Checklist: why is my result wrong?</h2>
<table><tr><th>Suspect</th><th>How to check</th></tr>
<tr><td>Join fan-out</td><td>Compare row count before and after the join. Aggregate first.</td></tr>
<tr><td>Duplicate rows</td><td>COUNT(*) vs COUNT(DISTINCT id), or GROUP BY with HAVING COUNT(*) &gt; 1.</td></tr>
<tr><td>LEFT JOIN turned INNER</td><td>Look for WHERE conditions on right-table columns.</td></tr>
<tr><td>Date and time mistakes</td><td>Timestamp vs date, time zone, inclusive or exclusive end date.</td></tr>
<tr><td>Wrong grain</td><td>Is each row an impression, a user, or a day? Count the right thing.</td></tr>
<tr><td>NULL surprises</td><td>COUNT(col) skips NULLs. = NULL never matches.</td></tr></table>
<h2>Fix the broken queries</h2>
<p>Each box starts with a broken query. Run it, see the problem, fix it, then check.</p>
${ex('B1')}${ex('B2')}${ex('B3')}${ex('B4')}
<p>In the interview, explain out loud: "The symptom was..., I suspected..., I checked by..., the cause was..., the fix is...".</p>`},

{id:'py1',g:'Python from zero',t:'Python basics 1: first steps',html:`
<p class="lead">Python is the easiest programming language to read, which is why support engineers use it. You do not need to become an expert for this role. You need to read short scripts, understand them, and make small changes.</p>
<h2>What do support engineers use Python for?</h2>
<ul><li>Reading files like CSV and logs.</li><li>Counting and grouping data, like a small GROUP BY.</li><li>Calling APIs and checking the response.</li><li>Automating repeated work.</li></ul>
<h2>How to run Python</h2>
<p>Install Python 3 from python.org. Save your code in a file like <code>hello.py</code> and run <code>python hello.py</code> (or <code>python3 hello.py</code>). Or use any online Python editor in the browser, where nothing needs installing.</p>
<h2>Your first program</h2>
<pre><code>print("Hello AMC")</code></pre>
<p>Output: <code>Hello AMC</code>. <code>print()</code> shows something on the screen.</p>
<h2>Comments</h2>
<pre><code># A line starting with hash is a note for humans. Python ignores it.</code></pre>
<h2>Variables: labelled boxes</h2>
<p>A variable stores a value under a name. You do not need to say the type.</p>
<pre><code>name = "Prince"
clicks = 40
ctr = 0.25
is_active = True
print(name, clicks)</code></pre>
<h2>Data types</h2>
${tbl(['Type','Meaning','Example'],[['int','whole number','40'],['float','decimal number','0.25'],['str','text, in quotes','"Delhi"'],['bool','True or False (capital letters)','True'],['None','no value (like NULL in SQL)','None']])}
<p><code>type(x)</code> tells you the type of x.</p>
<h2>Operators</h2>
${tbl(['Sign','Meaning','Example','Result'],[['+ - *','add, subtract, multiply','5 * 3','15'],['/','divide (always decimal)','10 / 4','2.5'],['//','divide, keep whole part','10 // 3','3'],['%','remainder','10 % 3','1'],['**','power','2 ** 3','8']])}
<h2>Working with text</h2>
<pre><code>city = "  Hyderabad "
city.strip()          # "Hyderabad"   removes spaces at the ends
city.strip().upper()  # "HYDERABAD"
len("amc")            # 3
"a,b,c".split(",")    # ['a', 'b', 'c']
"AMC" in "Use AMC"    # True
text = "Hello"
text[0]               # "H"   counting starts from 0
text[0:3]             # "Hel" characters 0, 1, 2</code></pre>
<h2>f-strings: put values inside text</h2>
<pre><code>clicks = 40
imps = 160
print(f"CTR is {clicks/imps:.2%}")</code></pre>
<p>Put <code>f</code> before the quotes, and write values inside curly brackets. <code>:.2%</code> means show as a percentage with 2 decimals.</p>
<h2>Predict the output</h2>
${pq(`x = 10
y = 3
print(x // y, x % y)`,`3 1`,'// gives the whole part of division, % gives the remainder.')}
${pq(`name = "amc"
print(name.upper(), len(name))`,`AMC 3`)}
${pq(`clicks = 40
imps = 160
print(f"CTR is {clicks/imps:.2%}")`,`CTR is 25.00%`,'40 divided by 160 is 0.25, shown as a percentage.')}
${pq(`print("a,b,c".split(","))`,`['a', 'b', 'c']`,'split() cuts text into a list.')}
${pq(`print("10" + "5", int("10") + 5)`,`105 15`,'Text with + joins. Numbers with + add. int() turns text into a number.')}
${note(`<p>Remember: variables, print, the text methods strip, upper, split, and f-strings. These appear in almost every small script.</p>`)}
`},

{id:'py2',g:'Python from zero',t:'Python basics 2: lists, dictionaries, loops',html:`
<p class="lead">Data in Python usually lives in lists and dictionaries. Once you understand these two and the for loop, you can read most support scripts.</p>
<h2>Lists: an ordered collection</h2>
<pre><code>nums = [5, 2, 9]
nums[0]            # 5     first item (counting starts from 0)
nums.append(1)     # now [5, 2, 9, 1]
len(nums)          # 4
sorted(nums)       # [1, 2, 5, 9]
sum(nums)          # 17
9 in nums          # True</code></pre>
<h2>Dictionaries: key and value pairs</h2>
<p>A dictionary is like a phone book: you look up a name (key) to get a number (value).</p>
<pre><code>user = {"name": "Neha", "city": "Pune"}
user["city"]            # "Pune"
user["age"] = 28        # add a new key
user.get("phone", "NA") # "NA"  safe lookup, no error if missing
user.keys()             # the names of the keys
user.items()            # key and value pairs</code></pre>
<p>Use <code>.get()</code> when a key may be missing. Using <code>user["phone"]</code> on a missing key gives a KeyError.</p>
<h2>The for loop: do something for each item</h2>
<pre><code>for n in [10, 20, 30]:
    print(n * 2)

for i in range(3):      # 0, 1, 2
    print(i)</code></pre>
<p>The indented lines (4 spaces) are the loop body. Indentation is how Python knows what belongs inside.</p>
<h2>A table in Python is a list of dictionaries</h2>
<pre><code>rows = [
    {"campaign": "A", "clicks": 10},
    {"campaign": "B", "clicks": 4},
    {"campaign": "A", "clicks": 6},
]</code></pre>
<p>Each dictionary is one row. A loop over the list goes row by row.</p>
<h2>Counting and grouping (the GROUP BY of Python)</h2>
<pre><code>totals = {}
for r in rows:
    totals[r["campaign"]] = totals.get(r["campaign"], 0) + r["clicks"]
print(totals)     # {'A': 16, 'B': 4}</code></pre>
<p>This is the same as <code>SELECT campaign, SUM(clicks) ... GROUP BY campaign</code>.</p>
<h2>Three more things to recognise</h2>
<ul><li><b>List comprehension:</b> a one-line loop. <code>[x * 2 for x in range(1, 4)]</code> gives <code>[2, 4, 6]</code>.</li><li><b>Sorting rows:</b> <code>sorted(rows, key=lambda r: r["clicks"], reverse=True)</code> sorts by clicks, highest first. The lambda is a tiny function.</li><li><b>Tuple and set:</b> a tuple <code>(1, 2)</code> is a list that cannot change. A set <code>{1, 2}</code> keeps unique values only.</li></ul>
<h2>Predict the output</h2>
${pq(`nums = [5, 2, 9]
nums.append(1)
print(len(nums), sorted(nums))`,`4 [1, 2, 5, 9]`)}
${pq(`d = {"a": 1, "b": 2}
print(d["b"], d.get("z", 0))`,`2 0`,'.get() returns the default (0) when the key is missing.')}
${pq(`rows = [{"c": "A", "n": 10}, {"c": "B", "n": 4}]
total = 0
for r in rows:
    total += r["n"]
print(total)`,`14`,'total += r["n"] means: add n to total.')}
${pq(`print([x * 2 for x in range(1, 4)])`,`[2, 4, 6]`,'range(1, 4) gives 1, 2, 3. The last number is not included.')}
${pq(`words = ["x", "y", "x"]
c = {}
for w in words:
    c[w] = c.get(w, 0) + 1
print(c)`,`{'x': 2, 'y': 1}`,'This is the standard counting pattern.')}
${note(`<p>Remember: list of dictionaries is a table, a for loop goes row by row, and a dictionary with .get() counts things.</p>`)}
`},

{id:'py3',g:'Python from zero',t:'Python basics 3: decisions, functions, errors',html:`
<p class="lead">Now we add decisions (if), reusable blocks (functions), and the skill you will use most in support: understanding errors.</p>
<h2>if, elif, else</h2>
<pre><code>revenue = 2500
if revenue &gt;= 2000:
    print("High")
elif revenue &gt;= 1000:
    print("Medium")
else:
    print("Low")</code></pre>
<p>Notice the colon <code>:</code> at the end of each line and the 4-space indentation. Missing them causes errors.</p>
<p>Conditions: <code>==</code> equal, <code>!=</code> not equal, <code>&gt;  &lt;  &gt;=  &lt;=</code>, and combine with <code>and</code>, <code>or</code>, <code>not</code>.</p>
<h2>while, break, continue</h2>
<pre><code>count = 0
while count &lt; 3:
    print(count)
    count += 1       # without this, the loop never ends
</code></pre>
<p><code>break</code> stops a loop early. <code>continue</code> skips to the next round.</p>
<h2>Functions: a reusable block</h2>
<pre><code>def ctr(clicks, impressions):
    if impressions == 0:
        return 0
    return round(clicks / impressions, 2)

print(ctr(1, 4))      # 0.25</code></pre>
<p><code>def</code> creates the function. <code>return</code> sends the answer back. Always think about the special case, like dividing by zero.</p>
<h2>try and except: handle errors safely</h2>
<pre><code>try:
    print(10 / 0)
except ZeroDivisionError:
    print("cannot divide")</code></pre>
<h2>Common errors and what they mean</h2>
${tbl(['Error','Meaning','Usual fix'],[['SyntaxError','Python cannot understand the line','Missing colon, bracket or quote'],['IndentationError','Spaces are wrong','Use 4 spaces consistently'],['NameError','A name is not defined','Spelling mistake, or used before creating'],['KeyError','Dictionary key is missing','Check the key name, or use .get()'],['TypeError','Wrong type for the operation','For example adding text and number'],['ZeroDivisionError','Divided by 0','Check the divisor first'],['FileNotFoundError','File path is wrong','Check name, folder and spelling']])}
<h2>How to read a traceback</h2>
<pre><code>Traceback (most recent call last):
  File "report.py", line 5, in &lt;module&gt;
    print(row["status"])
KeyError: 'status'</code></pre>
<p><b>Read from the bottom.</b> The last line says what went wrong: the key "status" is missing. The lines above say where: file report.py, line 5. Now you know what to check.</p>
<h2>Predict the output</h2>
${pq(`def ctr(c, i):
    if i == 0:
        return 0
    return round(c / i, 2)

print(ctr(5, 0), ctr(1, 4))`,`0 0.25`)}
${pq(`for i in range(3):
    if i == 1:
        continue
    print(i)`,`0
2`,'continue skips the print when i is 1.')}
${pq(`try:
    print(10 / 0)
except ZeroDivisionError:
    print("cannot divide")`,`cannot divide`)}
${pq(`print(bool(0), bool("a"), bool([]))`,`False True False`,'0, empty text and empty list count as False. Anything with content counts as True.')}
${note(`<p>Remember: indentation matters, functions use def and return, and read errors from the bottom.</p>`)}
`},

{id:'py4',g:'Python from zero',t:'Python basics 4: files, JSON, APIs, dates',html:`
<p class="lead">This topic covers the real support tasks: reading files, understanding JSON, calling an API, and working with dates.</p>
<h2>Reading a text file</h2>
<pre><code>with open("access.log") as f:
    for line in f:
        if "ERROR" in line:
            print(line.strip())</code></pre>
<p><code>with open(...)</code> opens the file and closes it automatically. The loop gives one line at a time. This is Python's version of <code>grep ERROR access.log</code>.</p>
<h2>Reading a CSV file</h2>
<pre><code>import csv

with open("queries.csv") as f:
    for row in csv.DictReader(f):
        print(row["user"], row["status"])</code></pre>
<p>DictReader turns each row into a dictionary, using the first line as keys.</p>
<h2>JSON: how APIs send data</h2>
<p>JSON looks like a Python dictionary with lists inside.</p>
<pre><code>import json
text = '{"status": "ok", "items": [{"id": 1}, {"id": 2}]}'
d = json.loads(text)
print(d["status"])          # ok
print(len(d["items"]))      # 2
print(d["items"][1]["id"])  # 2</code></pre>
<p>Move step by step: dictionary key, then list position, then key again.</p>
<h2>Calling an API with requests</h2>
<pre><code>import requests

resp = requests.get(url, headers={"Authorization": "Bearer " + token}, timeout=30)
print(resp.status_code)
if resp.status_code == 200:
    data = resp.json()
else:
    print("Failed:", resp.text)</code></pre>
${tbl(['Status code','Meaning','What to check'],[['200','OK','Read the data'],['400','Bad request','Your input or parameters'],['401','Not authenticated','Token missing or expired'],['403','Not allowed','Permissions or roles'],['404','Not found','URL or ID is wrong'],['429','Too many requests','Slow down and retry later'],['500','Server error','Not your fault. Retry, then escalate']])}
<h2>Working with dates</h2>
<pre><code>from datetime import datetime, timedelta
start = datetime(2026, 10, 5)
print(start + timedelta(days=7))   # 2026-10-12 00:00:00</code></pre>
<h2>Libraries you will see</h2>
${tbl(['Library','Used for'],[['csv, json','reading files and API data'],['requests','calling APIs'],['datetime','dates and times'],['os, sys','files, folders and arguments'],['re','searching text with patterns (regex)'],['pandas','tables of data. Optional to know, but common.']])}
<h2>Predict the output</h2>
${pq(`import json
text = '{"status": "ok", "items": [{"id": 1}, {"id": 2}]}'
d = json.loads(text)
print(d["status"], len(d["items"]), d["items"][1]["id"])`,`ok 2 2`)}
${pq(`from datetime import datetime, timedelta
print(datetime(2026, 10, 5) + timedelta(days=7))`,`2026-10-12 00:00:00`)}
<h2>What to say in the interview</h2>
<p>"My Python is basic. I can read scripts, run them, and make small changes. For example, I can read a CSV, count errors per type, or call an API and check the status code. SQL is my main tool, and I am improving it daily."</p>
`},

{id:'sh1',g:'Shell from zero',t:'Shell basics 1: terminal and files',html:`
<p class="lead">The shell (or terminal) is a text window where you type commands to the computer instead of clicking. Support engineers use it to look at logs and files quickly. We start from the very beginning.</p>
<h2>What is the shell?</h2>
<ul><li>The terminal is the window. The shell (usually bash) is the program inside that understands your commands.</li><li>It is available on Linux and macOS. On Windows, use WSL or Git Bash. Or use any online Linux terminal in the browser.</li><li>You see a prompt like <code>$</code>. You type a command and press Enter.</li></ul>
<h2>How a command looks</h2>
<pre><code>command  -options  arguments
ls       -l        reports</code></pre>
<p>The command is what to do. Options (starting with a dash) change how. Arguments say what to act on.</p>
<h2>Where am I? Folders and paths</h2>
<p>Files live in folders, like a tree. A path is the address of a file.</p>
<ul><li><b>Absolute path:</b> starts from the top, like <code>/home/prince/reports</code>.</li><li><b>Relative path:</b> starts from where you are, like <code>reports/jan.csv</code>.</li><li><code>.</code> means this folder. <code>..</code> means the folder above. <code>~</code> means your home folder.</li></ul>
<h2>The commands to learn first</h2>
${tbl(['Command','What it does','Example'],[['pwd','shows the folder you are in','pwd'],['ls','lists files. -l gives details, -a shows hidden files','ls -l'],['cd','changes folder','cd reports,  cd ..'],['mkdir','creates a folder','mkdir reports'],['touch','creates an empty file','touch a.txt'],['cp','copies a file','cp a.txt b.txt'],['mv','moves or renames a file','mv a.txt old.txt'],['rm','deletes a file. There is no recycle bin','rm old.txt'],['cat','shows the whole file','cat a.txt'],['echo','prints text','echo "hello"'],['clear','cleans the screen','clear'],['history','shows past commands','history'],['man, --help','shows help for a command','ls --help']])}
${warn(`<p><b>Be careful with rm.</b> Deleted files cannot be recovered. Never run <code>rm -r</code> (delete a whole folder) unless you are sure about the path.</p>`)}
<h2>Wildcards</h2>
<p><code>*</code> means any characters. <code>ls *.log</code> lists all files ending with .log. <code>?</code> means exactly one character.</p>
<h2>Writing into files: redirection</h2>
<ul><li><code>&gt;</code> writes output into a file, replacing what was there.</li><li><code>&gt;&gt;</code> adds output at the end of the file.</li></ul>
<h2>Predict the output</h2>
${pq(`$ pwd
/home/prince
$ mkdir reports
$ cd reports
$ pwd`,`/home/prince/reports`,'mkdir created the folder and cd moved into it.')}
${pq(`$ cd /home/prince/reports
$ cd ..
$ pwd`,`/home/prince`,'.. means one folder up.')}
${pq(`$ echo "ERROR 1" &gt; log.txt
$ echo "INFO 2" &gt;&gt; log.txt
$ cat log.txt`,`ERROR 1
INFO 2`,'The first command creates the file. The second adds a line at the end.')}
${pq(`$ wc -l log.txt`,`2 log.txt`,'wc -l counts the lines.')}
${note(`<p>Remember: pwd, ls, cd, cat, echo, and the two arrows. With these you can move around and read files.</p>`)}
`},

{id:'sh2',g:'Shell from zero',t:'Shell basics 2: search and combine text',html:`
<p class="lead">Logs and CSV files are just text. These commands help you search them, cut them, and count things. Think of each one as a small piece of SQL.</p>
<p>We use this small file called <code>queries.csv</code>:</p>
<pre><code>id,user,status,rows
101,amit,SUCCESS,120
102,neha,FAILED,0
103,amit,SUCCESS,0
104,ravi,FAILED,0
105,neha,SUCCESS,45</code></pre>
<h2>Seeing parts of a file</h2>
<ul><li><code>head -n 3 file</code> shows the first 3 lines. <code>tail -n 3 file</code> shows the last 3. <code>tail -f file</code> follows a growing log live.</li><li><code>less file</code> lets you scroll. Press q to quit.</li><li><code>wc -l file</code> counts lines.</li></ul>
<h2>grep: find lines</h2>
<ul><li><code>grep FAILED file</code> shows lines containing FAILED.</li><li><code>-c</code> counts matching lines. <code>-v</code> shows lines that do not match. <code>-i</code> ignores capital letters. <code>-n</code> shows line numbers. <code>-o</code> prints only the matching part.</li></ul>
<h2>cut: choose columns</h2>
<p><code>cut -d',' -f2 queries.csv</code> splits each line at commas and shows column 2.</p>
<h2>sort and uniq: group and count</h2>
<p><code>sort</code> orders lines. <code>uniq -c</code> counts repeated neighbouring lines, so always sort first. <code>sort -rn</code> sorts numbers from biggest.</p>
<h2>awk: pick fields and do small calculations</h2>
<p><code>awk -F',' '{print $2}' file</code> prints the second field, using comma as separator. <code>$1</code> is the first field, <code>NR</code> is the line number, and <code>END</code> runs after the last line.</p>
<h2>sed: find and replace</h2>
<p><code>sed 's/FAILED/ERROR/'</code> replaces the first FAILED in each line with ERROR.</p>
<h2>The pipe: connect commands</h2>
<p>The pipe <code>|</code> sends the output of one command into the next. This is the main idea of the shell: small commands joined together.</p>
<h2>Shell and SQL side by side</h2>
${tbl(['SQL idea','Shell tool'],[['WHERE','grep'],['SELECT some columns','cut or awk'],['COUNT(*)','wc -l or grep -c'],['GROUP BY and COUNT','sort | uniq -c'],['ORDER BY ... DESC','sort -rn'],['LIMIT','head'],['SUM','awk with END']])}
<h2>Predict the output</h2>
${pq(`$ head -n 3 queries.csv`,`id,user,status,rows
101,amit,SUCCESS,120
102,neha,FAILED,0`)}
${pq(`$ grep FAILED queries.csv`,`102,neha,FAILED,0
104,ravi,FAILED,0`)}
${pq(`$ grep -c SUCCESS queries.csv`,`3`,'Three lines contain SUCCESS.')}
${pq(`$ grep -v SUCCESS queries.csv`,`id,user,status,rows
102,neha,FAILED,0
104,ravi,FAILED,0`,'-v shows the lines that do not match. The header does not contain SUCCESS, so it is shown.')}
${pq(`$ cut -d',' -f2 queries.csv | tail -n +2 | sort | uniq -c`,`      2 amit
      2 neha
      1 ravi`,'cut takes the user column. tail -n +2 skips the header. sort and uniq -c count each user.')}
${pq(`$ awk -F',' '$4 == 0 {print $1}' queries.csv`,`102
103
104`,'It prints the id of lines where the rows field is 0. The header is not shown because "rows" is not 0.')}
${pq(`$ awk -F',' 'NR&gt;1 {sum += $4} END {print sum}' queries.csv`,`165`,'NR&gt;1 skips the header. It adds 120 + 0 + 0 + 0 + 45.')}
${pq(`$ echo "status=FAILED" | sed 's/FAILED/ERROR/'`,`status=ERROR`)}
${pq(`$ grep FAILED queries.csv | wc -l`,`2`,'Pipe: grep finds the lines, wc counts them.')}
${note(`<p>Remember: grep, cut, sort | uniq -c, head, tail, wc -l and the pipe. This is the basic toolkit for log work.</p>`)}
`},

{id:'sh3',g:'Shell from zero',t:'Shell basics 3: scripts, variables, curl',html:`
<p class="lead">A shell script is just commands saved in a file, so you can run them again and again. Support engineers write small scripts to avoid repeating the same steps.</p>
<h2>Your first script</h2>
<pre><code>#!/bin/bash
# hello.sh
echo "Hello from my first script"</code></pre>
<ul><li>The first line (<code>#!/bin/bash</code>) says which shell runs the script.</li><li>Make it runnable once: <code>chmod +x hello.sh</code></li><li>Run it: <code>./hello.sh</code></li></ul>
<h2>Variables</h2>
<pre><code>name="Prince"
echo "Hello $name"
today=$(date +%F)       # run a command and keep its result
echo "Today is $today"</code></pre>
<p>Important: no spaces around the <code>=</code>. Use <code>$name</code> to read the value. Use double quotes around variables.</p>
<h2>Arguments</h2>
<p>When you run <code>./script.sh access.log</code>, the word <code>access.log</code> becomes <code>$1</code> inside the script. <code>$2</code> is the second word and <code>$#</code> is how many words were given.</p>
<h2>if conditions</h2>
<pre><code>if [ -f "$file" ]; then
    echo "file exists"
else
    echo "file not found"
fi</code></pre>
${tbl(['Test','Meaning'],[['-f file','file exists'],['-d dir','folder exists'],['-z "$x"','x is empty'],['"$a" == "$b"','texts are equal'],['$n -gt 5','number is greater than 5 (also -lt, -eq, -ne)']])}
<p>Leave spaces inside the square brackets exactly as shown.</p>
<h2>Loops</h2>
<pre><code>for f in *.log; do
    echo "Checking $f"
    grep -c ERROR "$f"
done</code></pre>
<h2>Exit codes</h2>
<p>Every command ends with a number. <code>0</code> means success, anything else means failure. <code>$?</code> shows the last one. You can chain commands: <code>cmd1 &amp;&amp; cmd2</code> runs cmd2 only if cmd1 worked.</p>
<h2>A complete small script</h2>
<pre><code>#!/bin/bash
# usage: ./count_errors.sh access.log
file="$1"
if [ ! -f "$file" ]; then
    echo "File not found: $file"
    exit 1
fi
errors=$(grep -c ERROR "$file")
echo "Errors in $file: $errors"</code></pre>
${det('Explain this script line by line',`<ul><li><code>file="$1"</code> stores the first argument in a variable.</li><li><code>if [ ! -f "$file" ]</code> checks that the file does NOT exist.</li><li><code>exit 1</code> stops the script with a failure code.</li><li><code>errors=$(grep -c ERROR "$file")</code> counts ERROR lines and keeps the number.</li><li>The last line prints the result.</li></ul><p>If you run it on the access.log from the shell practice topic, it prints <code>Errors in access.log: 3</code>.</p>`)}
<h2>curl: call an API from the terminal</h2>
<pre><code>curl -s https://example.com/api/items
curl -s -H "Authorization: Bearer $TOKEN" https://example.com/api/items
curl -s -X POST -H "Content-Type: application/json" -d '{"name":"test"}' https://example.com/api/items
curl -s -o /dev/null -w "%{http_code}\\n" https://example.com/api/items</code></pre>
<ul><li><code>-s</code> silent mode (no progress bar). <code>-H</code> adds a header. <code>-X POST</code> sends a POST. <code>-d</code> sends data.</li><li>The last command prints only the status code (200, 401 and so on). Use the same codes table as in Python basics 4.</li><li>Keep tokens in a variable like <code>export TOKEN=...</code>, not typed into scripts you share.</li></ul>
<h2>Permissions in one minute</h2>
<p><code>ls -l</code> shows letters like <code>-rwxr-xr--</code>. r is read, w is write, x is run. If a script says "Permission denied", you probably forgot <code>chmod +x</code>.</p>
<h2>Predict the output</h2>
${pq(`name="Prince"
echo "Hello $name"`,`Hello Prince`)}
${pq(`# run as: ./args.sh a b c
echo "$# arguments, first is $1"`,`3 arguments, first is a`,'$# is the number of arguments and $1 is the first one.')}
${pq(`for i in 1 2 3; do
    echo "Round $i"
done`,`Round 1
Round 2
Round 3`)}
${note(`<p>Remember: shebang line, chmod +x, variables with $, $1 for arguments, if with square brackets, for loops, and curl with -H and -s.</p>`)}
`},

{id:'dsa1',g:'DSA from zero',t:'DSA basics 1: thinking, Big-O, lists and strings',html:`
<p class="lead">DSA means Data Structures and Algorithms. Do not be scared by the name. Here we start from zero and keep to the easy level that interviews for support roles use.</p>
${warn(`<p><b>How much DSA do you need?</b> The AMC job description asks for SQL, troubleshooting and customer skills, and does not mention DSA. But some Amazon support engineer interview reports include coding rounds with easy problems. So: finish SQL and your stories first, then learn these basics, and practise about ten easy problems. That is enough.</p>`)}
<h2>What are these two words?</h2>
<ul><li><b>Data structure:</b> a way to store data so it is easy to use. Think of a cupboard with shelves and boxes. Examples: list, dictionary, set, stack, queue.</li><li><b>Algorithm:</b> the step-by-step method to solve a problem. Think of a recipe. Examples: sorting, searching.</li></ul>
<p>Good solutions pick the right cupboard (data structure) and the right recipe (algorithm).</p>
<h2>Seven steps to solve any coding problem</h2>
<ol><li><b>Understand.</b> Repeat the problem in your own words. Ask about the input and the output.</li><li><b>Examples.</b> Write one or two small examples, and one tricky case.</li><li><b>Brute force.</b> Say the simple, slow way first. It is fine.</li><li><b>Improve.</b> Ask: can a dictionary, a set, or sorting make it faster?</li><li><b>Code.</b> Write clean code with clear names.</li><li><b>Test.</b> Walk through your example line by line. Try edge cases: empty input, one item, duplicates, negative numbers.</li><li><b>Say the complexity.</b> How does the time grow, and how much extra memory is used?</li></ol>
<h2>Big-O in plain words</h2>
<p>Big-O tells how the work grows when the input becomes bigger. It does not measure seconds. It measures growth.</p>
<p>Think of finding a name in a phone book of n names. Reading page by page is O(n). Opening in the middle and halving each time is O(log n). If you know the exact page number, it is O(1).</p>
${tbl(['Big-O','Name','Example','Feels like'],[['O(1)','constant','Read list[0], or look up a dictionary key','Same speed for any size'],['O(log n)','logarithmic','Binary search in a sorted list','Very fast, grows slowly'],['O(n)','linear','One loop over all items','Double the data, double the work'],['O(n log n)','linearithmic','Sorting with sorted()','A little slower than linear'],['O(n squared)','quadratic','A loop inside a loop','Double the data, four times the work']])}
<h3>Easy rules to estimate</h3>
<ul><li>One loop over n items: O(n).</li><li>A loop inside a loop over the same data: O(n squared).</li><li>Cutting the problem in half each time: O(log n).</li><li>Ignore small details: O(2n) is just O(n).</li><li><b>Space complexity</b> is the extra memory you use. A new list or dictionary of size n is O(n) space.</li></ul>
${det('Practise: what is the complexity of each?',`<ol><li><code>for x in nums: print(x)</code> is <b>O(n)</b>. One loop.</li><li><code>for a in nums: for b in nums: ...</code> is <b>O(n squared)</b>. Loop inside a loop.</li><li><code>for x in nums: if x in other_list</code> is <b>O(n squared)</b>, because <code>in</code> on a list is itself a loop.</li><li><code>for x in nums: if x in other_set</code> is <b>O(n)</b>, because a set lookup is O(1) on average. This is why sets and dictionaries are so useful.</li></ol>`)}
<h2>Lists (arrays)</h2>
<p>A Python list is an ordered collection. Counting starts from 0.</p>
${tbl(['Operation','Example','Cost'],[['Read by position','nums[2]','O(1)'],['Add at the end','nums.append(5)','O(1)'],['Remove from the end','nums.pop()','O(1)'],['Insert or remove at the start or middle','nums.insert(0, 5)','O(n)'],['Check if an item is present','7 in nums','O(n)'],['Sort','sorted(nums)','O(n log n)']])}
<h2>Strings</h2>
<ul><li>A string is like a list of characters, and it cannot be changed in place. Operations create a new string.</li><li>Useful: <code>s[::-1]</code> (reverse), <code>s.lower()</code>, <code>s.split()</code>, <code>"".join(list)</code>, <code>s.isalnum()</code>, <code>len(s)</code>.</li></ul>
<h2>The accumulate pattern</h2>
<p>Start with an empty value, loop over the items, update the value. Most simple problems use it: total, count, maximum, building a new list.</p>
<h2>Predict the output</h2>
<details><summary>Predict the output</summary><div class="dbody"><pre><code>nums = [3, 1, 4, 1, 5]
print(max(nums), nums.index(1), nums[-1], nums[1:3])</code></pre><p><b>Output:</b></p><pre><code>5 1 5 [1, 4]</code></pre><p>index(1) finds the first position of 1. nums[-1] is the last item. nums[1:3] takes positions 1 and 2.</p></div></details><details><summary>Predict the output</summary><div class="dbody"><pre><code>s = "support"
print(s[::-1], s[:3], len(s))</code></pre><p><b>Output:</b></p><pre><code>troppus sup 7</code></pre><p>[::-1] reads the text backwards.</p></div></details><details><summary>Predict the output</summary><div class="dbody"><pre><code>total = 0
for n in [2, 4, 6]:
    total += n
print(total)</code></pre><p><b>Output:</b></p><pre><code>12</code></pre><p>The accumulate pattern: start at 0, add each item.</p></div></details>
${note(`<p>Remember: say the brute force first, improve with a dictionary or set, test with edge cases, and always state the complexity.</p>`)}
`},

{id:'dsa2',g:'DSA from zero',t:'DSA basics 2: dictionaries, sets, stacks, queues',html:`
<p class="lead">These four structures solve most easy interview problems. The dictionary alone solves about half of them.</p>
<h2>Dictionary (hash map): jump straight to the answer</h2>
<p>A dictionary stores key and value pairs. Like a phone book, you do not read every page. You jump to the name. Lookup, insert and delete take O(1) time on average.</p>
<pre><code>ages = {"neha": 28, "amit": 31}
ages["neha"]          # 28
"ravi" in ages        # False
ages["ravi"] = 25     # add
</code></pre>
<h3>The counting pattern</h3>
<pre><code>counts = {}
for word in ["x", "y", "x"]:
    counts[word] = counts.get(word, 0) + 1
</code></pre>
<p>The shortcut is <code>Counter</code> from the collections module.</p>
<h2>Set: only unique values</h2>
<p>A set has no duplicates. Checking <code>x in my_set</code> is O(1) on average. Use it to remove duplicates or to check "have I seen this before?"</p>
<h2>Why a dictionary makes things faster: Two Sum</h2>
<p>Problem: find two numbers in a list that add up to a target. Brute force checks every pair, O(n squared). Better: for each number, ask the dictionary "have I already seen the number I need?" That is one loop, O(n).</p>
<h2>Stack: last in, first out</h2>
<p>Like a pile of plates. You put on top and take from the top. In Python, a list with <code>append()</code> and <code>pop()</code> works as a stack. Uses: undo, matching brackets, reading nested data.</p>
<h2>Queue: first in, first out</h2>
<p>Like a ticket line. The first one in is the first one out. Use <code>deque</code> from collections and <code>popleft()</code>. Do not use <code>list.pop(0)</code> for big queues, because it is O(n).</p>
<h2>How these connect to what you already know</h2>
${tbl(['Structure','Where you saw the same idea'],[['Dictionary with counting','SQL GROUP BY with COUNT, and shell sort | uniq -c'],['Set','SQL DISTINCT'],['Stack','Checking that brackets in JSON or code match'],['Queue','A support ticket queue, handled in the order received']])}
<h2>Predict the output</h2>
<details><summary>Predict the output</summary><div class="dbody"><pre><code>from collections import Counter
c = Counter("banana")
print(c)
print(c.most_common(1))</code></pre><p><b>Output:</b></p><pre><code>Counter({'a': 3, 'n': 2, 'b': 1})
[('a', 3)]</code></pre><p>Counter counts items. most_common(1) gives the top one.</p></div></details><details><summary>Predict the output</summary><div class="dbody"><pre><code>print(len(set([1, 2, 2, 3, 3, 3])), 2 in {1, 2, 3})</code></pre><p><b>Output:</b></p><pre><code>3 True</code></pre><p>A set keeps unique values only.</p></div></details><details><summary>Predict the output</summary><div class="dbody"><pre><code>stack = []
stack.append("a")
stack.append("b")
print(stack.pop(), stack)</code></pre><p><b>Output:</b></p><pre><code>b ['a']</code></pre><p>A stack is last in, first out. "b" went in last, so it comes out first.</p></div></details><details><summary>Predict the output</summary><div class="dbody"><pre><code>from collections import deque
q = deque([1, 2, 3])
q.append(4)
print(q.popleft(), list(q))</code></pre><p><b>Output:</b></p><pre><code>1 [2, 3, 4]</code></pre><p>A queue is first in, first out. popleft() removes the oldest item.</p></div></details>
`},

{id:'dsa3',g:'DSA from zero',t:'DSA basics 3: sorting, searching, patterns, recursion',html:`
<p class="lead">Here are the classic ideas that appear in interviews. Learn the idea first. The code is short.</p>
<h2>Sorting</h2>
<ul><li>In real work, use <code>sorted()</code> or <code>list.sort()</code>. They take O(n log n) time.</li><li><code>key=</code> sorts by a rule, and <code>reverse=True</code> goes from the biggest.</li><li>Idea of <b>bubble sort</b>: compare neighbours and swap, again and again. It is easy but slow, O(n squared).</li><li>Idea of <b>merge sort</b>: split the list in halves, sort each half, merge them. It is O(n log n). Merging two sorted lists is the key step.</li></ul>
<pre><code>words = ["banana", "kiwi", "apple"]
print(sorted(words))
print(sorted(words, key=len))
print(sorted([3, 1, 2], reverse=True))</code></pre>
<p>Output:</p>
<pre><code>['apple', 'banana', 'kiwi']
['kiwi', 'apple', 'banana']
[3, 2, 1]</code></pre>
<h3>Merging two sorted lists</h3>
<pre><code>def merge(a, b):
    i = j = 0
    out = []
    while i &lt; len(a) and j &lt; len(b):
        if a[i] &lt;= b[j]:
            out.append(a[i])
            i += 1
        else:
            out.append(b[j])
            j += 1
    return out + a[i:] + b[j:]

print(merge([1, 4, 8], [2, 3, 9]))</code></pre>
<p>Output:</p>
<pre><code>[1, 2, 3, 4, 8, 9]</code></pre>
<h2>Searching</h2>
<ul><li><b>Linear search:</b> check every item. O(n). Works on any list.</li><li><b>Binary search:</b> on a <b>sorted</b> list, look at the middle. If the target is bigger, ignore the left half. If smaller, ignore the right half. Repeat. O(log n).</li></ul>
<pre><code>def binary_search(nums, target):
    low, high = 0, len(nums) - 1
    while low &lt;= high:
        mid = (low + high) // 2
        if nums[mid] == target:
            return mid
        elif nums[mid] &lt; target:
            low = mid + 1
        else:
            high = mid - 1
    return -1

print(binary_search([1, 3, 5, 7, 9, 11], 7))</code></pre>
<p>Output:</p>
<pre><code>3</code></pre>
<h2>Two pointers</h2>
<p>Use two positions, one from the left and one from the right, and move them towards each other. Good for palindromes, reversing, and finding pairs in sorted lists. It avoids a nested loop.</p>
<h2>Sliding window</h2>
<p>For problems about consecutive items, keep a window and slide it by one step. Add the new item, remove the old one, and update the best answer. Example: the biggest sum of any 3 consecutive numbers.</p>
<pre><code>def max_sum_k(nums, k):
    window = sum(nums[:k])
    best = window
    for i in range(k, len(nums)):
        window += nums[i] - nums[i - k]
        best = max(best, window)
    return best

print(max_sum_k([2, 1, 5, 1, 3, 2], 3))</code></pre>
<p>Output:</p>
<pre><code>9</code></pre>
<h2>Recursion</h2>
<p>A function that calls itself on a smaller problem. It needs a <b>base case</b>, which is the point where it stops, or it never ends.</p>
<pre><code>def factorial(n):
    if n &lt;= 1:
        return 1
    return n * factorial(n - 1)

print(factorial(5))</code></pre>
<p>Output:</p>
<pre><code>120</code></pre>
<p><b>Memoization</b> means remembering answers you already found, usually in a dictionary, so you do not repeat work. Fibonacci without it is very slow.</p>
<pre><code>def fib(n, memo=None):
    if memo is None:
        memo = {}
    if n &lt;= 1:
        return n
    if n not in memo:
        memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
    return memo[n]

print(fib(10))</code></pre>
<p>Output:</p>
<pre><code>55</code></pre>
<h2>Linked lists and trees: know the idea</h2>
<p>These are less likely in support interviews. Know the definitions and be able to read a small example.</p>
<ul><li><b>Linked list:</b> a chain of nodes. Each node holds a value and points to the next. You cannot jump to position 5. You must walk from the start.</li><li><b>Tree:</b> a node with children. A <b>binary tree</b> has at most two children (left and right). Walking through every node is called traversal.</li></ul>
<pre><code>class Node:
    def __init__(self, value):
        self.value = value
        self.next = None

a = Node(1)
b = Node(2)
c = Node(3)
a.next = b
b.next = c

values = []
cur = a
while cur:
    values.append(cur.value)
    cur = cur.next
print(values)</code></pre>
<p>Output:</p>
<pre><code>[1, 2, 3]</code></pre>
<pre><code>class TreeNode:
    def __init__(self, value, left=None, right=None):
        self.value = value
        self.left = left
        self.right = right

def inorder(node):
    if node is None:
        return []
    return inorder(node.left) + [node.value] + inorder(node.right)

root = TreeNode(2, TreeNode(1), TreeNode(3))
print(inorder(root))</code></pre>
<p>Output:</p>
<pre><code>[1, 2, 3]</code></pre>
<p>Inorder means: left side, then this node, then right side.</p>
${note(`<p>Remember: sorted() in practice, binary search needs sorted data, recursion needs a base case, and a dictionary can remember answers.</p>`)}
`},

{id:'dsa4',g:'DSA from zero',t:'DSA basics 4: ten easy practice problems',html:`
<p class="lead">Try each problem yourself first, in any online Python editor or on your computer. Only then open the hint and solution. Ten problems like these are enough for the easy level.</p>
${note(`<p>The sample outputs here were produced by running the code, so you can compare with your own results.</p>`)}
<details><summary>Problem 1: Reverse a string</summary><div class="dbody"><p><b>Task:</b> Given "support", return "troppus".</p><p><b>Why it matters for you:</b> Reversing text is a small step in many parsing tasks.</p><p><b>Try first. Hint:</b> Python can read a string backwards with a slice. The loop version builds a new string from the end.</p><p><b>Solution:</b></p><pre><code>def reverse_string(s):
    return s[::-1]

print(reverse_string("support"))</code></pre><p><b>Output:</b></p><pre><code>troppus</code></pre><p><b>Complexity:</b> O(n) time, O(n) space</p></div></details><details><summary>Problem 2: Check a palindrome</summary><div class="dbody"><p><b>Task:</b> Return True if the text reads the same forwards and backwards, ignoring capitals, spaces and punctuation.</p><p><b>Why it matters for you:</b> Cleaning text before comparing is common in log and data work.</p><p><b>Try first. Hint:</b> Clean the text first. Then use two pointers from both ends and move inwards.</p><p><b>Solution:</b></p><pre><code>def is_palindrome(s):
    cleaned = "".join(ch.lower() for ch in s if ch.isalnum())
    left, right = 0, len(cleaned) - 1
    while left &lt; right:
        if cleaned[left] != cleaned[right]:
            return False
        left += 1
        right -= 1
    return True

print(is_palindrome("A man, a plan, a canal: Panama"), is_palindrome("amc"))</code></pre><p><b>Output:</b></p><pre><code>True False</code></pre><p><b>Complexity:</b> O(n) time, O(n) space</p></div></details><details><summary>Problem 3: Count errors by code</summary><div class="dbody"><p><b>Task:</b> From log lines, count how many ERROR lines there are for each error code, most common first.</p><p><b>Why it matters for you:</b> This is exactly the log summary you do with grep, sort and uniq -c, or with SQL GROUP BY.</p><p><b>Try first. Hint:</b> Loop through the lines. For ERROR lines, cut out the code. Use a Counter.</p><p><b>Solution:</b></p><pre><code>from collections import Counter

lines = [
    "ERROR code=SYNTAX user=neha",
    "INFO ok user=amit",
    "ERROR code=TIMEOUT user=ravi",
    "ERROR code=SYNTAX user=neha",
]

counts = Counter()
for line in lines:
    if line.startswith("ERROR"):
        code = line.split("code=")[1].split()[0]
        counts[code] += 1

print(counts.most_common())</code></pre><p><b>Output:</b></p><pre><code>[('SYNTAX', 2), ('TIMEOUT', 1)]</code></pre><p><b>Complexity:</b> O(n) time, O(k) space where k is the number of different codes</p></div></details><details><summary>Problem 4: Find duplicates</summary><div class="dbody"><p><b>Task:</b> Return the numbers that appear more than once, sorted.</p><p><b>Why it matters for you:</b> Duplicate rows are a top cause of wrong numbers in SQL too.</p><p><b>Try first. Hint:</b> Keep a set of numbers seen so far. If you see one again, it is a duplicate.</p><p><b>Solution:</b></p><pre><code>def find_duplicates(nums):
    seen = set()
    dups = set()
    for n in nums:
        if n in seen:
            dups.add(n)
        seen.add(n)
    return sorted(dups)

print(find_duplicates([4, 2, 7, 2, 9, 4, 4]))</code></pre><p><b>Output:</b></p><pre><code>[2, 4]</code></pre><p><b>Complexity:</b> O(n) time, O(n) space</p></div></details><details><summary>Problem 5: Two Sum</summary><div class="dbody"><p><b>Task:</b> Return the positions of two numbers that add up to a target. If none, return an empty list.</p><p><b>Why it matters for you:</b> The classic example of a dictionary turning O(n squared) into O(n).</p><p><b>Try first. Hint:</b> For each number, work out what you need (target minus number). Ask the dictionary if you have seen it.</p><p><b>Solution:</b></p><pre><code>def two_sum(nums, target):
    seen = {}
    for i, n in enumerate(nums):
        need = target - n
        if need in seen:
            return [seen[need], i]
        seen[n] = i
    return []

print(two_sum([2, 7, 11, 15], 9), two_sum([1, 2], 10))</code></pre><p><b>Output:</b></p><pre><code>[0, 1] []</code></pre><p><b>Complexity:</b> O(n) time, O(n) space. Brute force is O(n squared).</p></div></details><details><summary>Problem 6: Valid brackets</summary><div class="dbody"><p><b>Task:</b> Return True if every opening bracket (, [, { has a matching closing bracket in the right order.</p><p><b>Why it matters for you:</b> Checking JSON or query brackets is a real support task.</p><p><b>Try first. Hint:</b> Use a stack. Push opening brackets. When you see a closing one, the top of the stack must match.</p><p><b>Solution:</b></p><pre><code>def is_valid(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in s:
        if ch in "([{":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
    return not stack

print(is_valid("{[()]}"), is_valid("([)]"), is_valid("(("))</code></pre><p><b>Output:</b></p><pre><code>True False False</code></pre><p><b>Complexity:</b> O(n) time, O(n) space</p></div></details><details><summary>Problem 7: First non-repeating character</summary><div class="dbody"><p><b>Task:</b> Return the position of the first character that appears only once. If none, return -1.</p><p><b>Why it matters for you:</b> Finding the first unique value is similar to finding the first event per user.</p><p><b>Try first. Hint:</b> Count every character first. Then walk the text again and return the first one with a count of 1.</p><p><b>Solution:</b></p><pre><code>from collections import Counter

def first_unique(s):
    counts = Counter(s)
    for i, ch in enumerate(s):
        if counts[ch] == 1:
            return i
    return -1

print(first_unique("leetcode"), first_unique("aabb"))</code></pre><p><b>Output:</b></p><pre><code>0 -1</code></pre><p><b>Complexity:</b> O(n) time, O(1) extra space for a fixed alphabet</p></div></details><details><summary>Problem 8: Anagram check</summary><div class="dbody"><p><b>Task:</b> Return True if two words use exactly the same letters, ignoring capitals.</p><p><b>Why it matters for you:</b> Comparing two collections of items is a common pattern.</p><p><b>Try first. Hint:</b> If two words are anagrams, their sorted letters are equal.</p><p><b>Solution:</b></p><pre><code>def is_anagram(a, b):
    return sorted(a.lower()) == sorted(b.lower())

print(is_anagram("Listen", "Silent"), is_anagram("abc", "abd"))</code></pre><p><b>Output:</b></p><pre><code>True False</code></pre><p><b>Complexity:</b> O(n log n) time because of sorting. With a Counter it can be O(n).</p></div></details><details><summary>Problem 9: FizzBuzz</summary><div class="dbody"><p><b>Task:</b> For numbers 1 to 15, print Fizz for multiples of 3, Buzz for multiples of 5, FizzBuzz for multiples of both, or the number.</p><p><b>Why it matters for you:</b> A warm-up to check basic loops and conditions.</p><p><b>Try first. Hint:</b> Check the multiple of 15 first, otherwise the Fizz case catches it too early.</p><p><b>Solution:</b></p><pre><code>for i in range(1, 16):
    if i % 15 == 0:
        print("FizzBuzz")
    elif i % 3 == 0:
        print("Fizz")
    elif i % 5 == 0:
        print("Buzz")
    else:
        print(i)</code></pre><p><b>Output:</b></p><pre><code>1
2
Fizz
4
Buzz
Fizz
7
8
Fizz
Buzz
11
Fizz
13
14
FizzBuzz</code></pre><p><b>Complexity:</b> O(n) time, O(1) space</p></div></details><details><summary>Problem 10: Binary search</summary><div class="dbody"><p><b>Task:</b> Return the position of a target in a sorted list, or -1.</p><p><b>Why it matters for you:</b> Shows you understand efficient searching.</p><p><b>Try first. Hint:</b> Keep low and high. Look at the middle. Discard the half that cannot contain the target.</p><p><b>Solution:</b></p><pre><code>def binary_search(nums, target):
    low, high = 0, len(nums) - 1
    while low &lt;= high:
        mid = (low + high) // 2
        if nums[mid] == target:
            return mid
        elif nums[mid] &lt; target:
            low = mid + 1
        else:
            high = mid - 1
    return -1

print(binary_search([1, 3, 5, 7, 9, 11], 7), binary_search([1, 3, 5], 4))</code></pre><p><b>Output:</b></p><pre><code>3 -1</code></pre><p><b>Complexity:</b> O(log n) time, O(1) space</p></div></details>
<h2>How to behave in a coding round</h2>
<ul><li><b>Clarify first:</b> ask about input size, empty input, duplicates, and negative numbers.</li><li><b>Think aloud:</b> say the brute force, then the improvement.</li><li><b>Write clean code:</b> clear names, small steps.</li><li><b>Dry-run:</b> walk through your example line by line, and one edge case.</li><li><b>State the complexity</b> at the end, in one sentence.</li><li><b>If stuck:</b> write the brute force. A working slow answer is better than a blank page. Ask for a hint politely.</li></ul>
<h2>Practice plan</h2>
<p>If DSA is a worry, do two problems a day for four days after your SQL practice. Where you can, solve each one two ways, with a list and then with a dictionary or set, and notice the difference in speed.</p>
`},

{id:'tsframe',g:'Troubleshooting',t:'Troubleshooting framework',html:`
<p class="lead">Memorise these seven steps. Use them for every troubleshooting question, and say them out loud so the interviewer hears your structure.</p>
<ol>
<li><b>Clarify.</b> What is expected, what is happening, since when, how many affected, what is the impact and deadline.</li>
<li><b>Reproduce.</b> Run the same query on the same account and data. If you cannot reproduce, ask for screenshots, query IDs and time.</li>
<li><b>Isolate.</b> Shrink the problem: remove joins and filters one by one, test each table alone, narrow the time range.</li>
<li><b>Find root cause.</b> Is it the query, configuration, data, or a product defect? Keep evidence.</li>
<li><b>Give a workaround.</b> Something that unblocks the customer now, if they accept it.</li>
<li><b>Escalate with a clean repro.</b> Engineering should be able to reproduce in five minutes.</li>
<li><b>Follow up and prevent.</b> Update the customer, write a KB article, build a tool, give product feedback.</li></ol>
<h2>A good escalation message includes</h2>
<pre><code>Summary: one line of the problem
Impact: who is affected, deadline, severity
Environment: instance / account / table / time window
Steps to reproduce: exact query and steps
Expected vs actual result
What I already checked and ruled out
Workaround given (if any)
Customer communication so far</code></pre>
${note(`<p><b>Link to your resume.</b> Think of one real case, for example a GlobalLogic case where you used Splunk and built a repro for engineering. Write down what you did at each of the seven steps. This becomes your best Dive Deep story.</p>`)}`},

{id:'tsdrills',g:'Troubleshooting',t:'Scenario drills',html:`
<p class="lead">For each scenario, first answer aloud for 90 seconds. Then open it and compare with the model approach. Keep notes of what you missed.</p>
${DRILLS.map(d=>det(d.t,`<p><b>Ask:</b> ${d.ask}</p><p><b>Check:</b> ${d.check}</p><p><b>Likely causes:</b> ${d.causes}</p><p><b>Fix or workaround:</b> ${d.fix}</p><p><b>Escalate when:</b> ${d.esc}</p>`)).join('')}
${note(`<p>Whatever the scenario, start with questions, move step by step, and end with how you will communicate and prevent a repeat.</p>`)}`},

{id:'comm',g:'Troubleshooting',t:'Customer communication',html:`
<p class="lead">Amazon expects a very high customer standard. Your writing and your calls must be clear to both technical and non-technical people.</p>
<h2>Reply structure</h2>
<ol><li>Acknowledge the problem and the impact.</li><li>Say what you checked and found.</li><li>Give the solution or workaround, with the corrected query if relevant.</li><li>Say the next step and the time of the next update.</li><li>Ask for anything you still need.</li></ol>
<h2>Example reply</h2>
<pre><code>Hi Priya,

Thanks for raising this. I understand the conversion count is double
what you expected, and that your report is due on Friday.

I checked your query and found that the join between impressions and
conversions repeats each conversion for every impression of the same
campaign. This is why the total is inflated.

I have attached a corrected query that counts conversions first and
then joins. Please run it and share the result. On my side the total
matches your expected number.

I will check with you tomorrow at 11 AM IST to confirm everything is
fine. If you need anything before that, reply here.

Regards,
Name</code></pre>
<h2>Phone call tips</h2>
<ul><li>Listen fully before you suggest anything.</li><li>Repeat the problem in your own words to confirm.</li><li>Use simple words. Say "duplicate rows" before "fan-out".</li><li>Do not promise what you do not control. Promise the next update.</li></ul>`},

{id:'shell',g:'Shell and Python practice',t:'Shell on a log file',html:`
<p class="lead">You said shell is new for you. Good news: for this role you only need to read and filter text and logs. Learn these eight commands in about two hours, and you will be fine.</p>

<pre><code>2026-10-01 10:02:11 INFO  query_id=q101 user=amit status=SUCCESS rows=120
2026-10-01 10:05:42 ERROR query_id=q102 user=neha status=FAILED code=SYNTAX

2026-10-01 10:30:08 INFO  query_id=q106 user=ravi status=SUCCESS rows=45</code></pre>

${SH.map(x=>det('<code>'+x.c.replace(/</g,'&lt;')+'</code>',`<pre><code>${x.o}</code></pre><p>${x.w}</p>`)).join('')}
<h2>Quick reference</h2>
<table><tr><th>Command</th><th>Use</th></tr>
<tr><td>grep</td><td>find lines with some text</td></tr><tr><td>awk '{print $N}'</td><td>pick the Nth word of each line</td></tr>

${note(`<p>If you are asked something you do not know: say how you would find it. For example, "I would check the man page or --help, then test on a small file." That is a good answer.</p>`)}`},

{id:'python',g:'Shell and Python practice',t:'Python: reading real scripts',html:`
<p class="lead">The job description does not list Python. Do not spend more than one hour here. The goal is to read a short script and explain what it does.</p>
${det('Script 1: what does this do?',`<pre><code>import csv
from collections import Counter

errors = Counter()
with open("queries.csv") as f:
    for row in csv.DictReader(f):
        if row["status"] == "FAILED":
            errors[row["error_code"]] += 1

print(errors.most_common(3))</code></pre><p><b>Answer:</b> It reads a CSV of queries, counts the failed ones per error code, and prints the top three error codes. It is the Python version of GROUP BY error_code with COUNT, then ORDER BY DESC LIMIT 3.</p>`)}
${det('Script 2: what does this do?',`<pre><code>import requests

resp = requests.get(url, headers={"Authorization": "Bearer " + token}, timeout=30)
if resp.status_code != 200:
    print("Failed:", resp.status_code, resp.text)
else:
    data = resp.json()
    print(len(data["results"]))</code></pre><p><b>Answer:</b> It calls an API with a token, prints the error if the status is not 200, otherwise prints how many results came back.</p><p><b>Status codes to know:</b> 400 bad request (input problem), 401 not authenticated, 403 not allowed, 404 not found, 429 too many requests, 500 server error.</p>`)}
${det('Script 3: what does this do?',`<pre><code>rows = [{"campaign": "A", "clicks": 10}, {"campaign": "B", "clicks": 4}, {"campaign": "A", "clicks": 6}]
totals = {}
for r in rows:
    totals[r["campaign"]] = totals.get(r["campaign"], 0) + r["clicks"]
print(totals)</code></pre><p><b>Answer:</b> It adds clicks per campaign and prints {'A': 16, 'B': 4}. It is GROUP BY campaign with SUM(clicks).</p>`)}
<h2>What to say</h2>
<p>"My Python is basic. I can read scripts, run them, and make small changes. SQL is my main tool, and I am improving it now." Honest and confident.</p>`},
